<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>物件管理システム｜株式会社LDY</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkmtJQhOITvYuB0615DIHc1fd8ju_D3F8",
  authDomain: "ldy-house.firebaseapp.com",
  projectId: "ldy-house",
  storageBucket: "ldy-house.firebasestorage.app",
  messagingSenderId: "1000570179268",
  appId: "1:1000570179268:web:47ebb6b077088f39f88391"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let props = [], editId = null, currentImgUrl = null;

onSnapshot(collection(db, "properties"), snap => {
  props = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  props.sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  renderTable();
});

async function saveProperty() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('物件名は必須です'); return; }
  showLoading(true);
  const line = document.getElementById('f-line').value;
  const station = document.getElementById('f-station').value;
  const walk = document.getElementById('f-walk').value;
  const sta = line && station ? line+'【'+station+'】'+(walk?'徒歩'+walk+'分':'') : document.getElementById('f-sta-free').value.trim();
  const obj = {
    name,
    kind: document.getElementById('f-kind').value,
    loc: document.getElementById('f-loc').value.trim(),
    sta,
    land: parseFloat(document.getElementById('f-land').value)||null,
    floor: parseFloat(document.getElementById('f-floor').value)||null,
    layout: document.getElementById('f-layout').value.trim(),
    price: parseInt(document.getElementById('f-price-val').value)||null,
    built: document.getElementById('f-built').value.trim(),
    yld: parseFloat(document.getElementById('f-yield').value)||null,
    uso: document.getElementById('f-uso').value.trim(),
    struct: document.getElementById('f-struct').value.trim(),
    road: document.getElementById('f-road').value.trim(),
    kenpei: document.getElementById('f-kenpei').value.trim(),
    yoseki: document.getElementById('f-yoseki').value.trim(),
    zone: document.getElementById('f-zone').value,
    propStatus: document.getElementById('f-prop-status').value,
    saleStatus: document.getElementById('f-sale-status').value,
    baitai: document.getElementById('f-baitai-form').value,
    note: document.getElementById('f-note').value.trim(),
    img: currentImgUrl||null,
  };
  try {
    if (editId) { await updateDoc(doc(db,"properties",editId), obj); }
    else { obj.createdAt = serverTimestamp(); await addDoc(collection(db,"properties"), obj); }
    closeModal();
  } catch(e) { alert('保存失敗: '+e.message); }
  showLoading(false);
}

async function deleteProperty(id) {
  if (!confirm('この物件を削除しますか？')) return;
  await deleteDoc(doc(db,"properties",id));
}

window._firebaseSave = saveProperty;
window._firebaseDelete = deleteProperty;
window._setEditId = id => { editId = id; };
window._getProps = () => props;
window._setImgUrl = url => { currentImgUrl = url; };
window._clearImg = () => { currentImgUrl = null; };
</script>

<style>
:root {
  --navy: #1B2A6B;
  --navy-dark: #111C4E;
  --gold: #C9A84C;
  --gold-light: #E8D08A;
  --white: #FFFFFF;
  --bg: #F4F4F6;
  --border: #DDD;
  --text: #1a1a2e;
  --sub: #666;
  --card-shadow: 0 2px 12px rgba(27,42,107,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 100%);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.25);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo-mark{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-divider{width:1px;height:28px;background:rgba(201,168,76,0.4);}
.sys-title{font-size:13px;color:rgba(255,255,255,0.75);letter-spacing:2px;font-weight:400;}
.header-right{display:flex;gap:8px;align-items:center;}
.sync-badge{font-size:11px;color:var(--gold-light);background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);padding:3px 10px;border-radius:20px;}

/* ── BUTTONS ── */
.btn{font-size:12px;padding:7px 16px;border-radius:4px;border:1px solid #ccc;background:#fff;color:var(--text);cursor:pointer;white-space:nowrap;font-weight:500;transition:all 0.15s;}
.btn:hover{background:#f0f0f0;}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);border:none;font-weight:700;box-shadow:0 2px 8px rgba(201,168,76,0.3);}
.btn-gold:hover{opacity:0.9;box-shadow:0 4px 12px rgba(201,168,76,0.4);}
.btn-navy{background:var(--navy);color:#fff;border:none;font-weight:600;}
.btn-navy:hover{background:var(--navy-dark);}

/* ── STATS ── */
.stats-bar{display:flex;gap:0;background:var(--white);border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.stat-item{flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border);position:relative;}
.stat-item:last-child{border-right:none;}
.stat-item::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--gold);transition:width 0.3s;}
.stat-item:hover::after{width:80%;}
.stat-num{font-size:24px;font-weight:700;color:var(--navy);}
.stat-label{font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:0.5px;}

/* ── FILTERS ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:var(--white);border-bottom:2px solid var(--gold);align-items:center;}
.filter-bar input,.filter-bar select{font-size:12px;padding:7px 12px;border:1px solid #ccc;border-radius:4px;background:#fff;color:var(--text);outline:none;transition:border-color 0.15s;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--navy);}
.filter-bar input{min-width:220px;}
.filter-label{font-size:11px;color:var(--sub);font-weight:600;margin-right:-4px;}

/* ── TABLE ── */
.table-wrap{margin:16px 20px;border-radius:6px;border:1px solid var(--border);overflow:hidden;background:#fff;box-shadow:var(--card-shadow);}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:rgba(255,255,255,0.85);font-weight:600;font-size:11px;padding:10px 10px;text-align:left;letter-spacing:0.5px;}
th:first-child{border-radius:0;}
td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8f8ff;}
.prop-thumb{width:56px;height:42px;object-fit:cover;border-radius:3px;border:1px solid #ddd;}
.no-img{width:56px;height:42px;background:linear-gradient(135deg,#eee,#ddd);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#999;border:1px solid #ddd;}

/* ── STATUS TAGS ── */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:2px;font-weight:600;white-space:nowrap;letter-spacing:0.3px;}
.tag-rent{background:#E6F1FB;color:#185FA5;}
.tag-full{background:#EAF3DE;color:#3B6D11;}
.tag-empty{background:#FFF3CD;color:#856404;}
.tag-build{background:#EDE8FD;color:#5B4DB0;}
.tag-done{background:#FDECEA;color:#C62828;}
.tag-applied{background:#FFF0D5;color:#A06000;}
.tag-sale{background:#E8F5E9;color:#2E7D32;}
.tag-other{background:#F5F5F5;color:#666;}
.kind-tag{font-size:10px;padding:2px 7px;border:1px solid var(--border);border-radius:2px;color:var(--sub);white-space:nowrap;}
.count-info{font-size:11px;color:var(--sub);padding:6px 20px 0;}
.btn-row{display:flex;gap:4px;}
.btn-xs{font-size:10px;padding:3px 9px;border-radius:3px;border:1px solid #ccc;background:transparent;cursor:pointer;color:#555;}
.btn-xs:hover{background:#f0f0f0;}
.btn-del{color:#a00;border-color:#f7c1c1;}
.btn-del:hover{background:#fff0f0;}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,15,40,0.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:8px;width:540px;max-width:96%;max-height:92vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.25);}
.modal-head{background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0;}
.modal-head h3{font-size:15px;font-weight:700;color:#fff;letter-spacing:1px;}
.modal-close{background:none;border:none;color:rgba(255,255,255,0.6);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}
.modal-close:hover{color:#fff;}
.modal-body{padding:20px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:700;letter-spacing:0.5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid #ccc;border-radius:4px;outline:none;transition:border-color 0.15s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--navy);}
.form-row textarea{resize:vertical;height:64px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);background:#fafafa;border-radius:0 0 8px 8px;}
.section-title{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:1px;margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--gold);}

/* ── IMG UPLOAD ── */
.img-drop{border:2px dashed #bbb;border-radius:6px;padding:18px;text-align:center;cursor:pointer;color:#999;font-size:12px;transition:all 0.2s;background:#fafafa;}
.img-drop:hover,.img-drop.dragover{border-color:var(--gold);background:#fffbf0;color:var(--gold);}
.img-drop-icon{font-size:32px;margin-bottom:6px;}
.img-prev-wrap{position:relative;display:block;width:100%;}
.img-prev{width:100%;height:160px;object-fit:cover;border-radius:4px;border:1px solid #ddd;}
.img-clear{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.65);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.img-uploading{font-size:12px;color:var(--navy);margin-top:6px;display:none;font-weight:600;}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.8);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading-overlay.show{display:flex;}
.loading-spinner{width:40px;height:40px;border:3px solid #eee;border-top:3px solid var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;font-weight:700;color:var(--navy);}

/* ── PRINT PREVIEW MODAL ── */
.print-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.print-modal-bg.open{display:flex;}
.print-modal-inner{background:#fff;border-radius:8px;width:100%;max-width:880px;box-shadow:0 16px 48px rgba(0,0,0,0.3);}
.print-modal-head{background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0;}
.print-modal-head span{font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;}
.print-modal-body{padding:16px;max-height:80vh;overflow-y:auto;background:#e8e8e8;}

/* ── PRINT PAGE (A4横向き 1列×6行) ── */
.print-page{
  width:277mm;
  background:#fff;
  margin:0 auto 12px;
  padding:8mm 8mm;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;
}
.print-page-header{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--navy);
  padding-bottom:5px;margin-bottom:6px;
}
.print-page-logo{display:flex;align-items:center;gap:8px;}
.print-logo-mark{font-size:16px;font-weight:900;background:linear-gradient(135deg,#E8D08A,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.print-company{font-size:10px;font-weight:700;color:var(--navy);}
.print-page-title{font-size:20px;font-weight:900;letter-spacing:6px;color:var(--navy);}
.print-page-addr{font-size:7px;color:#555;text-align:right;line-height:1.6;}
.print-gold-line{height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));margin-bottom:6px;}

/* 縦1列×6行カード */
.cards-col{display:flex;flex-direction:column;gap:4px;}
.prop-card{
  display:grid;
  grid-template-columns:100px 1fr 1fr 1fr;
  gap:0;
  border:1px solid #ccc;
  border-radius:3px;
  overflow:hidden;
  min-height:52px;
  position:relative;
  background:#fff;
}
.card-img-col{
  width:100px;min-height:52px;
  position:relative;
  background:#f0f0f0;
  overflow:hidden;
  flex-shrink:0;
}
.card-img-col img{width:100%;height:100%;object-fit:cover;}
.card-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#aaa;background:linear-gradient(135deg,#eee,#ddd);}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:18px;font-weight:900;border:3px solid;border-radius:4px;padding:1px 5px;opacity:0.85;white-space:nowrap;z-index:10;}
.stamp-done{color:#C00;border-color:#C00;}
.stamp-applied{color:#c07000;border-color:#c07000;}
.card-main{padding:4px 6px;border-right:1px solid #eee;display:flex;flex-direction:column;justify-content:center;}
.card-name{font-size:9px;font-weight:700;color:var(--navy);margin-bottom:2px;line-height:1.2;}
.card-price{font-size:11px;font-weight:900;color:#C00;margin-bottom:2px;}
.card-tags{display:flex;gap:3px;flex-wrap:wrap;}
.card-tag{font-size:7px;padding:1px 4px;border-radius:2px;font-weight:600;}
.card-tag-sale{background:#E8F5E9;color:#2E7D32;}
.card-tag-empty{background:#FFF3CD;color:#856404;}
.card-tag-applied{background:#FFF0D5;color:#A06000;}
.card-tag-done{background:#FDECEA;color:#C62828;}
.card-tag-build{background:#EDE8FD;color:#5B4DB0;}
.card-tag-other{background:#F5F5F5;color:#666;}
.card-info{padding:4px 5px;border-right:1px solid #eee;}
.card-info table{width:100%;border-collapse:collapse;}
.card-info table td{padding:0.5px 2px;font-size:7px;vertical-align:top;line-height:1.4;}
.card-info table td:first-child{color:#888;white-space:nowrap;width:38%;}
.card-info table td:last-child{color:#222;font-weight:500;}
.card-notes-col{padding:4px 5px;}
.card-notes-col .notes-title{font-size:7px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.card-notes-col ol{padding-left:10px;font-size:6.5px;color:#444;line-height:1.5;}

@media print {
  body>*:not(#printable){display:none!important;}
  #printable{display:block!important;}
  .print-page{margin:0;box-shadow:none;page-break-after:always;}
  @page{size:A4 landscape;margin:8mm;}
}
#printable{display:none;}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">保存中...</div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <span class="logo-mark">LDY</span>
    <div class="logo-divider"></div>
    <span class="sys-title">物件管理システム</span>
  </div>
  <div class="header-right">
    <span class="sync-badge" id="sync-status">⚡ 接続中...</span>
    <button class="btn btn-gold" onclick="openModal()">＋ 物件を追加</button>
    <button class="btn btn-navy" onclick="showPrintPreview()">📄 印刷プレビュー</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-label">総物件数</div></div>
  <div class="stat-item"><div class="stat-num" id="s-sale">0</div><div class="stat-label">販売中</div></div>
  <div class="stat-item"><div class="stat-num" id="s-applied">0</div><div class="stat-label">申込あり</div></div>
  <div class="stat-item"><div class="stat-num" id="s-done">0</div><div class="stat-label">販売済</div></div>
  <div class="stat-item"><div class="stat-num" id="s-empty">0</div><div class="stat-label">空室</div></div>
  <div class="stat-item"><div class="stat-num" id="s-build">0</div><div class="stat-label">建築中</div></div>
</div>

<!-- FILTERS -->
<div class="filter-bar">
  <input type="text" id="f-keyword" placeholder="🔍　物件名・所在地・最寄り駅で検索..." oninput="renderTable()" />
  <select id="f-type" onchange="renderTable()">
    <option value="">種別：すべて</option>
    <option>マンション・アパート</option><option>一戸建て</option><option>土地</option>
    <option>商業物件・オフィス</option><option>区分マンション</option>
  </select>
  <select id="f-sale-filter" onchange="renderTable()">
    <option value="">販売状況：すべて</option>
    <option>販売中</option><option>申込あり</option><option>販売済</option>
  </select>
  <select id="f-prop-filter" onchange="renderTable()">
    <option value="">物件現状：すべて</option>
    <option>空室</option><option>賃貸中</option><option>満室賃貸中</option><option>建築中</option><option>古屋有</option><option>更地</option>
  </select>
  <select id="f-baitai" onchange="renderTable()">
    <option value="">取引：すべて</option>
    <option>売主</option><option>代理</option>
  </select>
</div>

<p class="count-info" id="count-info"></p>

<!-- TABLE -->
<div class="table-wrap">
  <table>
    <colgroup>
      <col style="width:5%"><col style="width:13%"><col style="width:8%"><col style="width:13%"><col style="width:13%">
      <col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:7%"><col style="width:3%">
    </colgroup>
    <thead>
      <tr>
        <th>写真</th><th>物件名</th><th>種別</th><th>所在地</th><th>最寄り駅</th>
        <th>土地面積</th><th>延床面積</th><th>価格</th><th>販売状況</th><th>物件現状</th><th>取引</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">物件を追加</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- 写真 -->
      <div class="section-title">📷 外観写真</div>
      <div class="form-row">
        <div class="img-drop" id="img-drop" onclick="document.getElementById('img-file-input').click()">
          <div id="img-drop-content">
            <div class="img-drop-icon">🏠</div>
            <div style="font-weight:600;color:#555;">クリックまたはドラッグ＆ドロップ</div>
            <div style="font-size:10px;margin-top:4px;color:#aaa;">JPG・PNG・WEBP 対応</div>
          </div>
          <div class="img-prev-wrap" id="img-prev-wrap" style="display:none;">
            <img id="img-prev" class="img-prev" />
            <button class="img-clear" onclick="event.stopPropagation();clearImage()">✕</button>
          </div>
        </div>
        <div class="img-uploading" id="img-uploading">⏳ アップロード中...</div>
        <input type="file" id="img-file-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)" />
      </div>

      <!-- 基本情報 -->
      <div class="section-title">🏢 基本情報</div>
      <div class="form-row"><label>物件名 *</label><input id="f-name" placeholder="例：浅草橋3丁目ビル" /></div>
      <div class="form-grid">

// ── Cloudinary ──
var CLD_CLOUD = 'dujllruro', CLD_PRESET = 'ldy-property';

async function uploadToCloudinary(file) {
  var fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  var r = await fetch('https://api.cloudinary.com/v1_1/'+CLD_CLOUD+'/image/upload',{method:'POST',body:fd});
  var d = await r.json();
  if (d.secure_url) return d.secure_url;
  throw new Error(d.error?d.error.message:'失敗');
}
window.handleFileSelect = async function(e) {
  var f = e.target.files[0]; if(f) await processImage(f);
};
async function processImage(file) {
  document.getElementById('img-uploading').style.display='block';
  try {
    var url = await uploadToCloudinary(file);
    showPreview(url); window._setImgUrl(url);
  } catch(e) { alert('アップロード失敗: '+e.message); }
  document.getElementById('img-uploading').style.display='none';
}
function showPreview(url) {
  document.getElementById('img-prev').src=url;
  document.getElementById('img-drop-content').style.display='none';
  document.getElementById('img-prev-wrap').style.display='block';
}
window.clearImage = function() {
  window._clearImg();
  document.getElementById('img-prev').src='';
  document.getElementById('img-drop-content').style.display='block';
  document.getElementById('img-prev-wrap').style.display='none';
  document.getElementById('img-file-input').value='';
};
var drop = document.getElementById('img-drop');
drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('dragover');});
drop.addEventListener('dragleave',function(){drop.classList.remove('dragover');});
drop.addEventListener('drop',function(e){
  e.preventDefault();drop.classList.remove('dragover');
  var f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/')) processImage(f);
});

var lineSelect = document.getElementById('f-line');
var stationSelect = document.getElementById('f-station');
Object.keys(LINES).forEach(function(l){
  var o = document.createElement('option'); o.value=l; o.textContent=l; lineSelect.appendChild(o);
});
window.updateStations = function() {
  var line = lineSelect.value;
  stationSelect.innerHTML = '<option value="">駅を選択</option>';
  if (line && LINES[line]) {
    LINES[line].forEach(function(s){
      var o=document.createElement('option'); o.value=s; o.textContent=s; stationSelect.appendChild(o);
    });
  }
};

// ── ユーティリティ ──
function showLoading(v){ document.getElementById('loading').className='loading-overlay'+(v?' show':''); }

function saleStatusClass(s){
  if(!s) return 'tag-other';
  if(s==='販売済') return 'tag-done';
  if(s==='申込あり') return 'tag-applied';
  if(s==='販売中') return 'tag-sale';
  return 'tag-other';
}
function propStatusClass(s){
  if(!s) return 'tag-other';
  if(s.includes('満室')||s.includes('賃貸')) return 'tag-rent';
  if(s.includes('建築')) return 'tag-build';
  if(s.includes('空室')) return 'tag-empty';
  return 'tag-other';
}
function kindShort(k){
  return (k||'').replace('マンション・アパート','マンション').replace('商業物件・オフィス','商業').replace('区分マンション','区分').replace('一戸建て','戸建');
}
function getFiltered(){
  var props=window._getProps?window._getProps():[];
  var kw=document.getElementById('f-keyword').value.trim().toLowerCase();
  var type=document.getElementById('f-type').value;
  var sale=document.getElementById('f-sale-filter').value;
  var prop=document.getElementById('f-prop-filter').value;
  var baitai=document.getElementById('f-baitai').value;
  return props.filter(function(p){
    if(kw&&!(p.name||'').toLowerCase().includes(kw)&&!(p.loc||'').toLowerCase().includes(kw)&&!(p.sta||'').toLowerCase().includes(kw)) return false;
    if(type&&p.kind!==type) return false;
    if(sale&&p.saleStatus!==sale) return false;
    if(prop&&p.propStatus!==prop) return false;
    if(baitai&&p.baitai!==baitai) return false;
    return true;
  });
}

window.renderTable = function(){
  var props=window._getProps?window._getProps():[];
  var filtered=getFiltered();
  document.getElementById('count-info').textContent=filtered.length+'件表示中 / 全'+props.length+'件';
  document.getElementById('s-total').textContent=props.length;
  document.getElementById('s-sale').textContent=props.filter(function(p){return p.saleStatus==='販売中';}).length;
  document.getElementById('s-applied').textContent=props.filter(function(p){return p.saleStatus==='申込あり';}).length;
  document.getElementById('s-done').textContent=props.filter(function(p){return p.saleStatus==='販売済';}).length;
  document.getElementById('s-empty').textContent=props.filter(function(p){return p.propStatus&&p.propStatus.includes('空室');}).length;
  document.getElementById('s-build').textContent=props.filter(function(p){return p.propStatus&&p.propStatus.includes('建築');}).length;
  document.getElementById('sync-status').textContent='✅ リアルタイム同期中';
  var tbody=document.getElementById('tbody');
  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="12" style="text-align:center;padding:2.5rem;color:#999;font-size:13px;">該当する物件がありません</td></tr>';
    return;
  }
  tbody.innerHTML=filtered.map(function(p){
    var kenpeiYoseki=(p.kenpei?p.kenpei+'%':'—')+'/'+(p.yoseki?p.yoseki+'%':'—');
    return '<tr ondblclick="openModal(\''+p.id+'\')" title="ダブルクリックで編集" style="cursor:pointer;">'+
      '<td>'+(p.img?'<img class="prop-thumb" src="'+p.img+'" alt="" />':'<div class="no-img">写真なし</div>')+'</td>'+
      '<td title="'+(p.name||'')+'"><strong>'+(p.name||'')+'</strong></td>'+
      '<td><span class="kind-tag">'+kindShort(p.kind)+'</span></td>'+
      '<td title="'+(p.loc||'')+'">'+((p.loc||'').replace('東京都',''))+'</td>'+
      '<td title="'+(p.sta||'')+'" style="font-size:11px;">'+(p.sta||'—')+'</td>'+
      '<td>'+(p.land?p.land+'㎡':'—')+'</td>'+
      '<td>'+(p.floor?p.floor+'㎡':'—')+'</td>'+
      '<td><strong>'+(p.price?p.price.toLocaleString()+'万':'—')+'</strong></td>'+
      '<td><span class="tag '+saleStatusClass(p.saleStatus)+'">'+(p.saleStatus||'—')+'</span></td>'+
      '<td><span class="tag '+propStatusClass(p.propStatus)+'">'+(p.propStatus||'—')+'</span></td>'+
      '<td>'+(p.baitai||'—')+'</td>'+
      '<td><div class="btn-row">'+
        '<button class="btn-xs" onclick="openModal(\''+p.id+'\')">編集</button>'+
        '<button class="btn-xs btn-del" onclick="window._firebaseDelete(\''+p.id+'\')">削除</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');
};

window.openModal = function(id){
  id=id||null;
  window._setEditId(id);
  document.getElementById('modal-title').textContent=id?'物件を編集':'物件を追加';
  window.clearImage();
  lineSelect.value=''; stationSelect.innerHTML='<option value="">駅を選択</option>';
  if(id){
    var p=(window._getProps?window._getProps():[]).find(function(x){return x.id===id;});
    if(!p) return;
    document.getElementById('f-name').value=p.name||'';
    document.getElementById('f-kind').value=p.kind||'マンション・アパート';
    document.getElementById('f-loc').value=p.loc||'';
    document.getElementById('f-sta-free').value=p.sta||'';
    document.getElementById('f-walk').value='';
    document.getElementById('f-land').value=p.land||'';
    document.getElementById('f-floor').value=p.floor||'';
    document.getElementById('f-layout').value=p.layout||'';
    document.getElementById('f-price-val').value=p.price||'';
    document.getElementById('f-built').value=p.built||'';
    document.getElementById('f-yield').value=p.yld||'';
    document.getElementById('f-uso').value=p.uso||'';
    document.getElementById('f-struct').value=p.struct||'';
    document.getElementById('f-road').value=p.road||'';
    document.getElementById('f-kenpei').value=p.kenpei||'';
    document.getElementById('f-yoseki').value=p.yoseki||'';
    document.getElementById('f-zone').value=p.zone||'';
    document.getElementById('f-sale-status').value=p.saleStatus||'販売中';
    document.getElementById('f-prop-status').value=p.propStatus||'空室';
    document.getElementById('f-baitai-form').value=p.baitai||'売主';
    document.getElementById('f-delivery').value=p.delivery||'';
    document.getElementById('f-note').value=p.note||'';
    if(p.img){window._setImgUrl(p.img);showPreview(p.img);}
  } else {
    ['f-name','f-loc','f-sta-free','f-walk','f-land','f-floor','f-layout','f-price-val',
     'f-built','f-yield','f-uso','f-struct','f-road','f-kenpei','f-yoseki','f-delivery','f-note']
      .forEach(function(x){document.getElementById(x).value='';});
    document.getElementById('f-kind').value='マンション・アパート';
    document.getElementById('f-zone').value='';
    document.getElementById('f-sale-status').value='販売中';
    document.getElementById('f-prop-status').value='空室';
    document.getElementById('f-baitai-form').value='売主';
  }
  document.getElementById('modal').classList.add('open');
};
window.closeModal=function(){document.getElementById('modal').classList.remove('open');};

// ── 印刷カード生成（A4横 1列×6行） ──
function saleStampHtml(saleStatus){
  if(saleStatus==='販売済') return '<div class="stamp stamp-done">済</div>';
  if(saleStatus==='申込あり') return '<div class="stamp stamp-applied">申込</div>';
  return '';
}
function cardTagClass(s){
  if(!s) return 'card-tag-other';
  if(s==='販売済') return 'card-tag-done';
  if(s==='申込あり') return 'card-tag-applied';
  if(s==='販売中') return 'card-tag-sale';
  if(s.includes('建築')) return 'card-tag-build';
  if(s.includes('空室')) return 'card-tag-empty';
  return 'card-tag-other';
}

function buildCards(list){
  return list.map(function(p){
    var kenpeiYoseki='';
    if(p.kenpei||p.yoseki) kenpeiYoseki=(p.kenpei?p.kenpei+'%':'—')+'／'+(p.yoseki?p.yoseki+'%':'—');
    var infoRows=[
      ['所在地',p.loc||'—'],
      ['最寄り駅',p.sta||'—'],
      ['用途',p.uso||'—'],
      ['土地面積',p.land?p.land+'㎡':'—'],
      ['延床面積',p.floor?p.floor+'㎡':'—'],
      ['間取り',p.layout||'—'],
      ['築年月',p.built||'—'],
      ['構造',p.struct||'—'],
      ['接道',p.road||'—'],
    ];
    var infoRows2=[
      ['建蔽率／容積率',kenpeiYoseki||'—'],
      ['用途地域',p.zone||'—'],
      ['回利り',p.yld?p.yld+'%':'—'],
      ['物件現状',p.propStatus||'—'],
      ['引渡可能日',p.delivery||'相談'],
      ['取引業態',p.baitai||'—'],
    ];
    var notes=(p.note||'').split('\n').filter(Boolean);
    return '<div class="prop-card">'+
      '<div class="card-img-col">'+
        (p.img?'<img src="'+p.img+'" alt="'+( p.name||'')+'" />':'<div class="card-no-img">写真なし</div>')+
        saleStampHtml(p.saleStatus)+
      '</div>'+
      '<div class="card-main">'+
        '<div class="card-name">'+(p.name||'')+'</div>'+
        '<div class="card-price">'+(p.price?p.price.toLocaleString()+'万円':'＊＊＊＊＊万円')+'</div>'+
        '<div class="card-tags">'+
          '<span class="card-tag '+cardTagClass(p.saleStatus)+'">'+(p.saleStatus||'—')+'</span>'+
          '<span class="card-tag '+cardTagClass(p.propStatus)+'">'+(p.propStatus||'—')+'</span>'+
          '<span class="card-tag" style="background:#eef;color:#335;">'+(p.baitai||'')+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="card-info">'+
        '<table>'+infoRows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'+
      '</div>'+
      '<div class="card-info">'+
        '<table>'+infoRows2.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'+
        (notes.length?'<div style="margin-top:3px;border-top:0.5px solid #eee;padding-top:2px;"><ol style="padding-left:10px;font-size:6.5px;color:#444;line-height:1.5;">'+notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ol></div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

window.showPrintPreview=function(){
  var filtered=getFiltered();
  var pages=[];
  for(var i=0;i<filtered.length;i+=6) pages.push(filtered.slice(i,i+6));
  var html=pages.map(function(page){
    return '<div class="print-page">'+
      '<div class="print-page-header">'+
        '<div class="print-page-logo">'+
          '<span class="print-logo-mark">LDY</span>'+
          '<span class="print-company">株式会社LDY</span>'+
        '</div>'+
        '<div class="print-page-title">物　件　一　覧　表</div>'+
        '<div class="print-page-addr">〒104-0061 東京都中央区銀座8-15-2 ACN銀座ビル9F<br>TEL：03-6260-6811　FAX：03-6260-6812<br>HP：https://ldy-house.com</div>'+
      '</div>'+
      '<div class="print-gold-line"></div>'+
      '<div class="cards-col">'+buildCards(page)+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('print-area-inner').innerHTML=html||'<p style="text-align:center;padding:2rem;color:#999;">表示する物件がありません</p>';
  document.getElementById('printable').innerHTML=html;
  document.getElementById('print-modal').classList.add('open');
};
window.closePrintModal=function(){document.getElementById('print-modal').classList.remove('open');};
window.doPrint=function(){window.print();};
