<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物件管理システム｜株式会社LDY</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkmtJQhOITvYuB0615DIHc1fd8ju_D3F8",
    authDomain: "ldy-house.firebaseapp.com",
    projectId: "ldy-house",
    storageBucket: "ldy-house.firebasestorage.app",
    messagingSenderId: "1000570179268",
    appId: "1:1000570179268:web:47ebb6b077088f39f88391"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let props = [];
  let editId = null;
  let currentImgData = null;

  onSnapshot(collection(db, "properties"), (snapshot) => {
    props = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    props.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
    renderTable();
  });

  async function saveProperty() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { alert('物件名は必須です'); return; }
    showLoading(true);
    const obj = {
      name,
      kind: document.getElementById('f-kind').value,
      loc: document.getElementById('f-loc').value.trim(),
      sta: document.getElementById('f-sta').value.trim(),
      land: parseFloat(document.getElementById('f-land').value) || null,
      floor: parseFloat(document.getElementById('f-floor').value) || null,
      layout: document.getElementById('f-layout').value.trim(),
      price: parseInt(document.getElementById('f-price-val').value) || null,
      built: document.getElementById('f-built').value.trim(),
      yld: parseFloat(document.getElementById('f-yield').value) || null,
      uso: document.getElementById('f-uso').value.trim(),
      struct: document.getElementById('f-struct').value.trim(),
      road: document.getElementById('f-road').value.trim(),
      far: document.getElementById('f-far').value.trim(),
      zone: document.getElementById('f-zone').value.trim(),
      status: document.getElementById('f-st').value,
      baitai: document.getElementById('f-baitai-form').value,
      note: document.getElementById('f-note').value.trim(),
      img: currentImgData || null,
    };
    try {
      if (editId) {
        await updateDoc(doc(db, "properties", editId), obj);
      } else {
        obj.createdAt = serverTimestamp();
        await addDoc(collection(db, "properties"), obj);
      }
      closeModal();
    } catch(e) {
      alert('保存に失敗しました: ' + e.message);
    }
    showLoading(false);
  }

  async function deleteProperty(id) {
    if (!confirm('この物件を削除しますか？')) return;
    await deleteDoc(doc(db, "properties", id));
  }

  window._firebaseSave = saveProperty;
  window._firebaseDelete = deleteProperty;
  window._setEditId = (id) => { editId = id; };
  window._getProps = () => props;
  window._setImgData = (data) => { currentImgData = data; };
  window._clearImg = () => { currentImgData = null; };
</script>

<style>
  :root { --red: #C00; --bg: #f7f7f5; --white: #fff; --border: #ddd; --text: #222; --sub: #666; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  .header { background: var(--white); border-bottom: 2px solid var(--red); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { font-size: 20px; font-weight: 900; color: var(--red); letter-spacing: 1px; }
  .sys-title { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { font-size: 12px; padding: 7px 14px; border-radius: 4px; border: 1px solid #ccc; background: var(--white); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f0f0f0; }
  .btn-red { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-red:hover { background: #a00; }
  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 20px; background: var(--white); border-bottom: 1px solid var(--border); }
  .stat-item { text-align: center; min-width: 80px; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--sub); margin-top: 1px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px; background: var(--white); border-bottom: 1px solid var(--border); }
  .filters input, .filters select { font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: var(--white); }
  .filters input { min-width: 200px; }
  .table-wrap { margin: 16px 20px; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; background: var(--white); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th { background: #f2f2f2; font-weight: 600; font-size: 11px; color: var(--sub); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .prop-thumb { width: 52px; height: 38px; object-fit: cover; border-radius: 3px; border: 1px solid #ddd; }
  .no-img { width: 52px; height: 38px; background: #eee; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; border: 1px solid #ddd; }
  .status-tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .s-rent { background: #E6F1FB; color: #185FA5; }
  .s-full { background: #EAF3DE; color: #3B6D11; }
  .s-empty { background: #FAEEDA; color: #854F0B; }
  .s-build { background: #EEEDFE; color: #534AB7; }
  .s-done { background: #f5d5d5; color: #a00; }
  .s-applied { background: #fff0d5; color: #a06000; }
  .s-other { background: #eee; color: #555; }
  .type-tag { font-size: 10px; padding: 2px 6px; border: 1px solid #ddd; border-radius: 3px; color: #666; white-space: nowrap; }
  .count-info { font-size: 11px; color: #999; padding: 4px 20px 0; }
  .btn-row { display: flex; gap: 4px; }
  .btn-xs { font-size: 10px; padding: 2px 8px; border-radius: 3px; border: 1px solid #ccc; background: transparent; cursor: pointer; color: #555; }
  .btn-xs:hover { background: #f0f0f0; }
  .btn-del { color: #a00; border-color: #f7c1c1; }
  .btn-del:hover { background: #fff0f0; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--white); border-radius: 8px; width: 500px; max-width: 96%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--red); padding-bottom: 8px; margin-bottom: 1rem; }
  .modal-header h3 { font-size: 16px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #999; line-height: 1; }
  .modal-close:hover { color: #333; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 3px; font-weight: 600; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; font-size: 13px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; }
  .form-row textarea { resize: vertical; height: 64px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
  .img-preview-el { width: 100%; max-height: 130px; object-fit: cover; border-radius: 4px; margin-top: 6px; }
  .img-hint { font-size: 10px; color: #999; margin-top: 4px; }
  .print-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
  .print-modal-bg.open { display: flex; }
  .print-modal-inner { background: var(--white); border-radius: 8px; width: 100%; max-width: 960px; padding: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .print-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .print-page { width: 100%; padding: 10px; background: #fff; margin-bottom: 10px; border: 1px solid #ccc; }
  .print-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--red); padding-bottom: 5px; margin-bottom: 8px; }
  .print-logo { font-size: 14px; font-weight: 900; color: var(--red); }
  .print-title { font-size: 20px; font-weight: 900; letter-spacing: 4px; }
  .print-addr { font-size: 8px; color: #555; text-align: right; line-height: 1.5; }
  .cards-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
  .prop-card { border: 1px solid #bbb; padding: 5px; position: relative; font-size: 8px; background: #fff; }
  .card-name { font-size: 10px; font-weight: 700; text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 2px; margin-bottom: 3px; }
  .card-price { font-size: 13px; font-weight: 900; color: var(--red); text-align: center; margin-bottom: 3px; }
  .card-img-wrap { position: relative; width: 100%; height: 90px; background: #eee; overflow: hidden; margin-bottom: 3px; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #999; }
  .stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-20deg); font-size: 30px; font-weight: 900; border: 4px solid; border-radius: 6px; padding: 2px 8px; opacity: 0.85; white-space: nowrap; pointer-events: none; z-index: 10; }
  .stamp-done { color: var(--red); border-color: var(--red); }
  .stamp-applied { color: #c07000; border-color: #c07000; }
  .card-table { width: 100%; border-collapse: collapse; }
  .card-table td { padding: 1px 2px; border-bottom: 0.5px solid #eee; vertical-align: top; font-size: 7.5px; }
  .card-table td:first-child { color: #666; width: 36%; white-space: nowrap; }
  .card-table td:last-child { font-weight: 500; }
  .card-notes { margin-top: 3px; border-top: 0.5px solid #eee; padding-top: 2px; }
  .card-notes ol { padding-left: 12px; font-size: 7px; color: #555; }
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 9999; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: var(--red); }
  .loading-overlay.show { display: flex; }
  @media print {
    body > *:not(#printable) { display: none !important; }
    #printable { display: block !important; }
    .print-page { page-break-after: always; border: none; }
  }
  #printable { display: none; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">保存中...</div>

<div class="header">
  <div class="header-left">
    <span class="logo">LDY</span>
    <span class="sys-title">物件管理システム</span>
  </div>
  <div class="header-right">
    <span id="sync-status" style="font-size:11px;color:#999;">⚡ 接続中...</span>
    <button class="btn btn-red" onclick="openModal()">＋ 物件を追加</button>
    <button class="btn" onclick="showPrintPreview()">📄 印刷プレビュー</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-label">総物件数</div></div>
  <div class="stat-item"><div class="stat-num" id="s-rent">0</div><div class="stat-label">賃貸中</div></div>
  <div class="stat-item"><div class="stat-num" id="s-empty">0</div><div class="stat-label">空室</div></div>
  <div class="stat-item"><div class="stat-num" id="s-build">0</div><div class="stat-label">建築中</div></div>
  <div class="stat-item"><div class="stat-num" id="s-done2">0</div><div class="stat-label">販売済</div></div>
  <div class="stat-item"><div class="stat-num" id="s-applied">0</div><div class="stat-label">申込あり</div></div>
</div>

<div class="filters">
  <input type="text" id="f-keyword" placeholder="🔍 物件名・所在地・最寄り駅で検索..." oninput="renderTable()" />
  <select id="f-type" onchange="renderTable()">
    <option value="">種別：すべて</option>
    <option>マンション・アパート</option><option>一戸建て</option><option>土地</option>
    <option>商業物件・オフィス</option><option>区分マンション</option>
  </select>
  <select id="f-status" onchange="renderTable()">
    <option value="">現状：すべて</option>
    <option>賃貸中</option><option>満室賃貸中</option><option>空室</option>
    <option>建築中</option><option>販売済</option><option>申込あり</option>
  </select>
  <select id="f-baitai" onchange="renderTable()">
    <option value="">取引：すべて</option>
    <option>売主</option><option>代理</option>
  </select>
</div>

<p class="count-info" id="count-info"></p>

<div class="table-wrap">
  <table>
    <colgroup>
      <col style="width:5%"><col style="width:14%"><col style="width:9%"><col style="width:14%">
      <col style="width:13%"><col style="width:7%"><col style="width:7%"><col style="width:8%">
      <col style="width:9%"><col style="width:7%"><col style="width:7%">
    </colgroup>
    <thead>
      <tr>
        <th>写真</th><th>物件名</th><th>種別</th><th>所在地</th><th>最寄り駅</th>
        <th>土地面積</th><th>延床面積</th><th>価格</th><th>現状</th><th>取引</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- 追加・編集モーダル -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">物件を追加</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-row">
      <label>外観写真（画像URLを入力）</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="f-img-url" placeholder="例：https://i.imgur.com/xxxxx.jpg" oninput="handleUrlInput()" />
        <button class="btn" style="font-size:11px;padding:4px 10px;white-space:nowrap;" onclick="clearImage()">クリア</button>
      </div>
      <img id="img-preview-el" class="img-preview-el" style="display:none;" />
      <p class="img-hint">💡 Imgur（imgur.com）に写真をアップしてURLを貼ってください（無料）</p>
    </div>

    <div class="form-row"><label>物件名 *</label><input id="f-name" placeholder="例：浅草橋3丁目ビル" /></div>
    <div class="form-row"><label>種別</label>
      <select id="f-kind">
        <option>マンション・アパート</option><option>一戸建て</option><option>土地</option>
        <option>商業物件・オフィス</option><option>区分マンション</option>
      </select>
    </div>
    <div class="form-row"><label>所在地</label><input id="f-loc" /></div>
    <div class="form-row"><label>最寄り駅</label><input id="f-sta" /></div>
    <div class="form-grid">
      <div class="form-row"><label>土地面積 (m²)</label><input id="f-land" type="number" /></div>
      <div class="form-row"><label>延床・専有面積 (m²)</label><input id="f-floor" type="number" /></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>間取り</label><input id="f-layout" placeholder="例：3LDK" /></div>
      <div class="form-row"><label>価格（万円）</label><input id="f-price-val" type="number" /></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>築年月</label><input id="f-built" placeholder="例：1990年12月" /></div>
      <div class="form-row"><label>回利り (%)</label><input id="f-yield" type="number" step="0.01" /></div>
    </div>
    <div class="form-row"><label>用途</label><input id="f-uso" /></div>
    <div class="form-row"><label>構造</label><input id="f-struct" /></div>
    <div class="form-row"><label>接道</label><input id="f-road" /></div>
    <div class="form-grid">
      <div class="form-row"><label>建蔽率・容積率</label><input id="f-far" placeholder="例：80% 400%" /></div>
      <div class="form-row"><label>用途地域</label><input id="f-zone" /></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>現状</label>
        <select id="f-st">
          <option>空室</option><option>賃貸中</option><option>満室賃貸中</option>
          <option>建築中</option><option>古屋有</option><option>更地</option>
          <option>販売済</option><option>申込あり</option>
        </select>
      </div>
      <div class="form-row"><label>取引業態</label>
        <select id="f-baitai-form"><option>売主</option><option>代理</option></select>
      </div>
    </div>
    <div class="form-row"><label>備考（改行で複数入力）</label><textarea id="f-note"></textarea></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-red" onclick="window._firebaseSave()">保存する</button>
    </div>
  </div>
</div>

<!-- 印刷プレビュー -->
<div class="print-modal-bg" id="print-modal">
  <div class="print-modal-inner">
    <div class="print-modal-header">
      <strong style="font-size:15px;">📄 印刷プレビュー</strong>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-red" onclick="doPrint()">🖨️ 印刷 / PDF保存</button>
        <button class="btn" onclick="closePrintModal()">閉じる</button>
      </div>
    </div>
    <div id="print-area-inner"></div>
  </div>
</div>

<div id="printable"></div>

<script>
  function showLoading(v) {
    document.getElementById('loading').className = 'loading-overlay' + (v ? ' show' : '');
  }
  function statusClass(s) {
    if (!s) return 's-other';
    if (s === '販売済') return 's-done';
    if (s === '申込あり') return 's-applied';
    if (s.includes('満室')) return 's-full';
    if (s.includes('賃貸')) return 's-rent';
    if (s.includes('建築')) return 's-build';
    if (s.includes('空室')) return 's-empty';
    return 's-other';
  }
  function kindShort(k) {
    return (k||'').replace('マンション・アパート','マンション').replace('商業物件・オフィス','商業')
      .replace('区分マンション','区分').replace('一戸建て','戸建');
  }
  function getFiltered() {
    const props = window._getProps ? window._getProps() : [];
    const kw = document.getElementById('f-keyword').value.trim().toLowerCase();
    const type = document.getElementById('f-type').value;
    const status = document.getElementById('f-status').value;
    const baitai = document.getElementById('f-baitai').value;
    return props.filter(p => {
      if (kw && !p.name?.toLowerCase().includes(kw) && !p.loc?.toLowerCase().includes(kw) && !(p.sta||'').toLowerCase().includes(kw)) return false;
      if (type && p.kind !== type) return false;
      if (status && p.status !== status) return false;
      if (baitai && p.baitai !== baitai) return false;
      return true;
    });
  }
  window.renderTable = function() {
    const props = window._getProps ? window._getProps() : [];
    const filtered = getFiltered();
    document.getElementById('count-info').textContent = filtered.length + '件表示中 / 全' + props.length + '件';
    document.getElementById('s-total').textContent = props.length;
    document.getElementById('s-rent').textContent = props.filter(p => p.status?.includes('賃貸')).length;
    document.getElementById('s-empty').textContent = props.filter(p => p.status?.includes('空室')).length;
    document.getElementById('s-build').textContent = props.filter(p => p.status?.includes('建築')).length;
    document.getElementById('s-done2').textContent = props.filter(p => p.status === '販売済').length;
    document.getElementById('s-applied').textContent = props.filter(p => p.status === '申込あり').length;
    document.getElementById('sync-status').textContent = '✅ リアルタイム同期中';
    const tbody = document.getElementById('tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:2rem;color:#999;">該当する物件がありません</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(p =>
      '<tr ondblclick="openModal(\'' + p.id + '\')" title="ダブルクリックで編集">' +
        '<td>' + (p.img ? '<img class="prop-thumb" src="' + p.img + '" alt="" />' : '<div class="no-img">写真なし</div>') + '</td>' +
        '<td title="' + (p.name||'') + '">' + (p.name||'') + '</td>' +
        '<td><span class="type-tag">' + kindShort(p.kind) + '</span></td>' +
        '<td title="' + (p.loc||'') + '">' + (p.loc||'').replace('東京都','') + '</td>' +
        '<td title="' + (p.sta||'') + '" style="font-size:11px;">' + (p.sta||'—') + '</td>' +
        '<td>' + (p.land ? p.land + '㎡' : '—') + '</td>' +
        '<td>' + (p.floor ? p.floor + '㎡' : '—') + '</td>' +
        '<td>' + (p.price ? p.price.toLocaleString() + '万' : '—') + '</td>' +
        '<td><span class="status-tag ' + statusClass(p.status) + '">' + (p.status||'—') + '</span></td>' +
        '<td>' + (p.baitai||'—') + '</td>' +
        '<td><div class="btn-row">' +
          '<button class="btn-xs" onclick="openModal(\'' + p.id + '\')">編集</button>' +
          '<button class="btn-xs btn-del" onclick="window._firebaseDelete(\'' + p.id + '\')">削除</button>' +
        '</div></td>' +
      '</tr>'
    ).join('');
  };
  window.openModal = function(id) {
    id = id || null;
    window._setEditId(id);
    document.getElementById('modal-title').textContent = id ? '物件を編集' : '物件を追加';
    clearImage();
    if (id) {
      const p = (window._getProps ? window._getProps() : []).find(x => x.id === id);
      if (!p) return;
      document.getElementById('f-name').value = p.name||'';
      document.getElementById('f-kind').value = p.kind||'マンション・アパート';
      document.getElementById('f-loc').value = p.loc||'';
      document.getElementById('f-sta').value = p.sta||'';
      document.getElementById('f-land').value = p.land||'';
      document.getElementById('f-floor').value = p.floor||'';
      document.getElementById('f-layout').value = p.layout||'';
      document.getElementById('f-price-val').value = p.price||'';
      document.getElementById('f-built').value = p.built||'';
      document.getElementById('f-yield').value = p.yld||'';
      document.getElementById('f-uso').value = p.uso||'';
      document.getElementById('f-struct').value = p.struct||'';
      document.getElementById('f-road').value = p.road||'';
      document.getElementById('f-far').value = p.far||'';
      document.getElementById('f-zone').value = p.zone||'';
      document.getElementById('f-st').value = p.status||'空室';
      document.getElementById('f-baitai-form').value = p.baitai||'売主';
      document.getElementById('f-note').value = p.note||'';
      if (p.img) {
        window._setImgData(p.img);
        document.getElementById('f-img-url').value = p.img;
        document.getElementById('img-preview-el').src = p.img;
        document.getElementById('img-preview-el').style.display = 'block';
      }
    } else {
      ['f-name','f-loc','f-sta','f-land','f-floor','f-layout','f-price-val',
       'f-built','f-yield','f-uso','f-struct','f-road','f-far','f-zone','f-note']
        .forEach(function(x){ document.getElementById(x).value = ''; });
      document.getElementById('f-kind').value = 'マンション・アパート';
      document.getElementById('f-st').value = '空室';
      document.getElementById('f-baitai-form').value = '売主';
    }
    document.getElementById('modal').classList.add('open');
  };
  window.closeModal = function() { document.getElementById('modal').classList.remove('open'); };
  window.handleUrlInput = function() {
    var url = document.getElementById('f-img-url').value.trim();
    if (url) {
      window._setImgData(url);
      document.getElementById('img-preview-el').src = url;
      document.getElementById('img-preview-el').style.display = 'block';
    }
  };
  window.clearImage = function() {
    window._clearImg && window._clearImg();
    document.getElementById('f-img-url').value = '';
    document.getElementById('img-preview-el').src = '';
    document.getElementById('img-preview-el').style.display = 'none';
  };
  function buildCards(list) {
    return list.map(function(p) {
      var isDone = p.status === '販売済';
      var isApplied = p.status === '申込あり';
      var stamp = isDone ? '<div class="stamp stamp-done">済</div>' : isApplied ? '<div class="stamp stamp-applied">申込</div>' : '';
      var notes = (p.note||'').split('\n').filter(Boolean);
      var rows = [
        ['所在地', p.loc||'—'], ['最寄り駅', p.sta||'—'], ['用途', p.uso||'—'],
        ['土地面積', p.land ? p.land+'㎡' : '—'], ['延床面積', p.floor ? p.floor+'㎡' : '—'],
        ['間取り', p.layout||'—'], ['築年月', p.built||'—'], ['構造', p.struct||'—'],
        ['接道', p.road||'—'], ['建蔽率・容積率', p.far||'—'], ['用途地域', p.zone||'—'],
        ['回利り', p.yld ? p.yld+'%' : '—'], ['現状', p.status||'—'],
        ['引渡可能日', '相談'], ['取引業態', p.baitai||'—'],
      ];
      return '<div class="prop-card">' +
        '<div class="card-name">' + (p.name||'') + '</div>' +
        '<div class="card-price">' + (p.price ? p.price.toLocaleString()+'万円' : '＊＊＊＊＊万円') + '</div>' +
        '<div class="card-img-wrap">' +
          (p.img ? '<img src="' + p.img + '" alt="' + (p.name||'') + '" />' : '<div class="card-img-placeholder">写真なし</div>') +
          stamp +
        '</div>' +
        '<table class="card-table">' + rows.map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>' +
        (notes.length ? '<div class="card-notes"><ol>' + notes.map(function(n){ return '<li>' + n + '</li>'; }).join('') + '</ol></div>' : '') +
      '</div>';
    }).join('');
  }
  window.showPrintPreview = function() {
    var filtered = getFiltered();
    var pages = [];
    for (var i = 0; i < filtered.length; i += 6) pages.push(filtered.slice(i, i+6));
    var html = pages.map(function(page) {
      return '<div class="print-page">' +
        '<div class="print-header">' +
          '<div class="print-logo">株式会社LDY</div>' +
          '<div class="print-title">物件一覧表</div>' +
          '<div class="print-addr">〒104-0061 東京都中央区銀座8-15-2 ACN銀座ビル9F<br>TEL：03-6260-6811　FAX：03-6260-6812</div>' +
        '</div>' +
        '<div class="cards-grid">' + buildCards(page) + '</div>' +
      '</div>';
    }).join('');
    document.getElementById('print-area-inner').innerHTML = html || '<p style="text-align:center;padding:2rem;color:#999;">表示する物件がありません</p>';
    document.getElementById('printable').innerHTML = html;
    document.getElementById('print-modal').classList.add('open');
  };
  window.closePrintModal = function() { document.getElementById('print-modal').classList.remove('open'); };
  window.doPrint = function() { window.print(); };
</script>
</body>
</html>
