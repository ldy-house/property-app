<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>管理画面｜株式会社LDY</title>
<style>
:root{
  --navy:#1B2A6B;--navy-dark:#111C4E;--gold:#C9A84C;--gold-light:#E8D08A;
  --white:#fff;--bg:#F0F2F8;--border:#DDD;--text:#1a1a2e;--sub:#666;
  --red:#C62828;--green:#2E7D32;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 60%,#2a3f8f 100%);}
.login-box{background:#fff;border-radius:12px;padding:40px 36px;width:380px;max-width:95%;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo-mark{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px;}
.login-logo-sub{font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:1px;}
.login-title{font-size:16px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:24px;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:0.5px;}
.login-field input{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:5px;font-size:14px;outline:none;transition:border-color 0.15s;}
.login-field input:focus{border-color:var(--navy);}
.login-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;border:none;border-radius:5px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:1px;transition:opacity 0.15s;}
.login-btn:hover{opacity:0.9;}
.login-err{color:var(--red);font-size:12px;text-align:center;margin-top:10px;min-height:18px;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.25);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo-mark{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.header-title{font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:2px;}
.header-right{display:flex;align-items:center;gap:12px;}
.user-info{font-size:11px;color:rgba(255,255,255,0.7);}
.btn-logout{font-size:11px;padding:5px 12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.8);border-radius:4px;cursor:pointer;}
.btn-logout:hover{background:rgba(255,255,255,0.1);}

/* BUTTONS */
.btn{font-size:12px;padding:7px 16px;border-radius:4px;border:1px solid #ccc;background:#fff;color:var(--text);cursor:pointer;white-space:nowrap;font-weight:500;transition:all 0.15s;}
.btn:hover{background:#f0f0f0;}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);border:none;font-weight:700;box-shadow:0 2px 8px rgba(201,168,76,0.3);}
.btn-gold:hover{opacity:0.9;}
.btn-navy{background:var(--navy);color:#fff;border:none;font-weight:600;}
.btn-navy:hover{background:var(--navy-dark);}
.btn-red{background:#fff;color:var(--red);border-color:#f7c1c1;}
.btn-red:hover{background:#fff0f0;}

/* STATS */
.stats-bar{display:flex;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.stat-item{flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border);}
.stat-item:last-child{border-right:none;}
.stat-num{font-size:22px;font-weight:700;color:var(--navy);}
.stat-label{font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:0.5px;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:2px solid var(--gold);align-items:center;}
.toolbar input,.toolbar select{font-size:12px;padding:7px 12px;border:1px solid #ccc;border-radius:4px;background:#fff;outline:none;transition:border-color 0.15s;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--navy);}
.toolbar input{min-width:220px;}
.toolbar-right{margin-left:auto;display:flex;gap:8px;}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 20px;}
.prop-card{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(27,42,107,0.08);overflow:hidden;transition:box-shadow 0.2s;border:1px solid var(--border);}
.prop-card:hover{box-shadow:0 6px 24px rgba(27,42,107,0.16);}
.card-photos{position:relative;height:200px;background:#eee;overflow:hidden;cursor:pointer;}
.card-photos img{width:100%;height:100%;object-fit:cover;transition:opacity 0.3s;}
.card-no-photo{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;font-size:13px;gap:8px;background:linear-gradient(135deg,#f0f0f0,#e0e0e0);}
.photo-nav{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;}
.photo-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer;transition:background 0.2s;}
.photo-dot.active{background:#fff;}
.photo-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;}
.photo-prev,.photo-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.45);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;}
.card-photos:hover .photo-prev,.card-photos:hover .photo-next{opacity:1;}
.photo-prev{left:8px;}
.photo-next{right:8px;}

/* SALE STATUS BADGE */
.sale-badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.5px;}
.badge-sale{background:var(--navy);color:#fff;}
.badge-applied{background:#E65100;color:#fff;}
.badge-done{background:#555;color:#fff;}

.card-body{padding:14px 16px;}
.card-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3;}
.card-price{font-size:18px;font-weight:900;color:var(--red);margin-bottom:8px;}
.card-price span{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:2px;font-weight:600;white-space:nowrap;}
.tag-kind{background:#EEF2FF;color:var(--navy);border:1px solid #C7D2FE;}
.tag-prop-empty{background:#FFF9C4;color:#7B6000;}
.tag-prop-rent{background:#E3F2FD;color:#1565C0;}
.tag-prop-full{background:#E8F5E9;color:#2E7D32;}
.tag-prop-build{background:#EDE7F6;color:#4527A0;}
.tag-prop-other{background:#F5F5F5;color:#555;}
.card-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;margin-bottom:10px;}
.info-row{display:flex;gap:4px;}
.info-label{color:var(--sub);white-space:nowrap;min-width:52px;}
.info-val{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-sta{font-size:11px;color:var(--sub);margin-bottom:10px;display:flex;gap:4px;align-items:flex-start;}
.card-sta-icon{flex-shrink:0;margin-top:1px;}
.card-notes{font-size:11px;color:var(--sub);border-top:1px solid #eee;padding-top:8px;margin-top:4px;max-height:60px;overflow:hidden;}
.card-actions{display:flex;gap:6px;padding:10px 16px;border-top:1px solid #eee;background:#fafafa;}
.count-info{font-size:11px;color:var(--sub);padding:6px 20px 0;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,15,40,0.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:580px;max-width:96%;max-height:93vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;}
.modal-head{background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0;flex-shrink:0;}
.modal-head h3{font-size:15px;font-weight:700;color:#fff;letter-spacing:1px;}
.modal-close{background:none;border:none;color:rgba(255,255,255,0.6);font-size:22px;cursor:pointer;line-height:1;padding:0 4px;}
.modal-close:hover{color:#fff;}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.form-section{margin-bottom:20px;}
.form-section-title{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:1.5px;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid var(--gold);}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:700;letter-spacing:0.3px;}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:9px 11px;border:1.5px solid #ddd;border-radius:5px;outline:none;transition:border-color 0.15s;font-family:inherit;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--navy);}
.form-row textarea{resize:vertical;height:110px;line-height:1.7;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:#fafafa;border-radius:0 0 10px 10px;flex-shrink:0;}

/* IMG UPLOAD */
.img-drop{border:2px dashed #ccc;border-radius:6px;padding:18px;text-align:center;cursor:pointer;color:#999;font-size:12px;transition:all 0.2s;background:#fafafa;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
.img-drop:hover,.img-drop.dragover{border-color:var(--gold);background:#fffbf0;color:var(--gold);}
.img-drop-icon{font-size:28px;}
.img-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px;}
.img-item{position:relative;border-radius:5px;overflow:hidden;aspect-ratio:4/3;background:#eee;}
.img-item img{width:100%;height:100%;object-fit:cover;}
.img-item-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background 0.2s;display:flex;flex-direction:column;justify-content:space-between;padding:5px;}
.img-item:hover .img-item-overlay{background:rgba(0,0,0,0.35);}
.img-del-btn{position:absolute;top:4px;right:4px;background:rgba(200,0,0,0.8);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.img-item:hover .img-del-btn{display:flex;}
.img-caption{width:100%;font-size:10px;padding:3px 5px;border:none;border-top:1px solid rgba(255,255,255,0.5);background:rgba(0,0,0,0.5);color:#fff;border-radius:0 0 4px 4px;outline:none;}
.img-uploading{font-size:12px;color:var(--navy);margin-top:6px;display:none;font-weight:600;}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.open{display:flex;}
.lightbox-img{max-width:90vw;max-height:75vh;object-fit:contain;border-radius:4px;}
.lightbox-caption{color:rgba(255,255,255,0.75);font-size:13px;margin-top:12px;text-align:center;max-width:600px;}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:0.7;}
.lightbox-close:hover{opacity:1;}
.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:22px;padding:12px 16px;cursor:pointer;border-radius:4px;}
.lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,0.3);}
.lightbox-prev{left:16px;}
.lightbox-next{right:16px;}
.lightbox-dots{display:flex;gap:6px;margin-top:12px;}
.lightbox-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;}
.lightbox-dot.active{background:#fff;}

/* PRINT */
.print-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.print-modal-bg.open{display:flex;}
.print-modal-inner{background:#fff;border-radius:10px;width:100%;max-width:980px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.print-modal-head{background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0;}
.print-modal-head span{font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;}
.print-modal-body{padding:16px;max-height:80vh;overflow-y:auto;background:#e8e8e8;}

/* PRINT PAGE - A4横向き 左に項目名固定・右に6列 */
.print-page{
  width:277mm;background:#fff;margin:0 auto 12px;
  padding:6mm 6mm;box-shadow:0 2px 8px rgba(0,0,0,0.15);
  font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;
}
.print-hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:4px;margin-bottom:3px;}
.print-hdr-logo{display:flex;align-items:center;gap:8px;}
.print-hdr-lmark{font-size:16px;font-weight:900;background:linear-gradient(135deg,#E8D08A,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.print-hdr-co{font-size:9px;font-weight:700;color:var(--navy);}
.print-hdr-ttl{font-size:18px;font-weight:900;letter-spacing:5px;color:var(--navy);}
.print-hdr-addr{font-size:7px;color:#555;text-align:right;line-height:1.6;}
.print-gold-bar{height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));margin-bottom:4px;}

/* テーブル形式：左に項目名、右に6列 */
.print-table{width:100%;border-collapse:collapse;font-size:7.5px;table-layout:fixed;}
.print-table th,.print-table td{border:0.5px solid #ccc;padding:2px 3px;vertical-align:middle;line-height:1.4;}
.print-table th{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;font-weight:700;text-align:center;width:16.666%;}
.print-table .row-label{background:#f0f2f8;color:var(--navy);font-weight:700;text-align:left;width:60px;white-space:nowrap;font-size:7px;}
.print-table .prop-name-row th{background:linear-gradient(135deg,var(--navy-dark),var(--navy));font-size:9px;padding:4px 3px;}
.print-table .price-row td{font-size:11px;font-weight:900;color:var(--red);text-align:center;}
.print-table .img-row td{padding:2px;text-align:center;position:relative;}
.print-table .img-row td img{width:100%;height:55px;object-fit:cover;display:block;}
.print-table .img-row td .no-img-cell{width:100%;height:55px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:7px;color:#aaa;}
.print-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:16px;font-weight:900;border:2.5px solid;border-radius:3px;padding:1px 4px;opacity:0.85;white-space:nowrap;z-index:10;}
.stamp-done{color:#C00;border-color:#C00;}
.stamp-applied{color:#c07000;border-color:#c07000;}
.print-table .note-row td{font-size:6.5px;color:#444;text-align:left;line-height:1.4;}
.print-table td{text-align:center;}
.print-table .val-cell{font-size:7.5px;color:#222;}

/* LOADING */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading-overlay.show{display:flex;}
.loading-spinner{width:40px;height:40px;border:3px solid #eee;border-top:3px solid var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;font-weight:700;color:var(--navy);}

@media print{
  body>*:not(#printable){display:none!important;}
  #printable{display:block!important;}
  .print-page{margin:0;box-shadow:none;page-break-after:always;}
  @page{size:A4 landscape;margin:6mm;}
}
#printable{display:none;}
</style>
</head>
<body>

<div class="loading-overlay" id="loading"><div class="loading-spinner"></div><div class="loading-text">処理中...</div></div>

<!-- LOGIN -->
<div id="login-screen" style="display:flex;">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-mark">LDY</div>
        <div class="login-logo-sub">株式会社LDY</div>
      </div>
      <div class="login-title">社員ログイン</div>
      <div class="login-field"><label>メールアドレス</label><input type="email" id="login-email" placeholder="example@ldy-house.com" /></div>
      <div class="login-field"><label>パスワード</label><input type="password" id="login-pass" placeholder="••••••••" /></div>
      <button class="login-btn" onclick="doLogin()">ログイン</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="main-app" style="display:none;">

  <div class="header">
    <div class="header-left">
      <span class="logo-mark">LDY</span>
      <span class="header-title">管理画面</span>
    </div>
    <div class="header-right">
      <span class="user-info" id="user-email"></span>
      <button class="btn-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-label">総物件数</div></div>
    <div class="stat-item"><div class="stat-num" id="s-sale">0</div><div class="stat-label">販売中</div></div>
    <div class="stat-item"><div class="stat-num" id="s-applied">0</div><div class="stat-label">申込あり</div></div>
    <div class="stat-item"><div class="stat-num" id="s-done">0</div><div class="stat-label">販売済</div></div>
    <div class="stat-item"><div class="stat-num" id="s-empty">0</div><div class="stat-label">空室</div></div>
    <div class="stat-item"><div class="stat-num" id="s-build">0</div><div class="stat-label">建築中</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="f-keyword" placeholder="🔍　物件名・所在地・駅で検索..." oninput="renderCards()" />
    <select id="f-sale" onchange="renderCards()">
      <option value="">販売状況：すべて</option>
      <option>販売中</option><option>申込あり</option><option>販売済</option>
    </select>
    <select id="f-prop" onchange="renderCards()">
      <option value="">物件現状：すべて</option>
      <option>空室</option><option>賃貸中</option><option>満室賃貸中</option><option>建築中</option><option>古屋有</option><option>更地</option>
    </select>
    <select id="f-kind" onchange="renderCards()">
      <option value="">種別：すべて</option>
      <option>マンション・アパート</option><option>一戸建て</option><option>土地</option><option>商業物件・オフィス</option><option>区分マンション</option>
    </select>
    <div class="toolbar-right">
      <button class="btn btn-navy" onclick="showPrint()">📄 印刷プレビュー</button>
      <button class="btn btn-gold" onclick="openModal()">＋ 物件を追加</button>
    </div>
  </div>
  <p class="count-info" id="count-info"></p>
  <div class="card-grid" id="card-grid"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-prev" onclick="lightboxMove(-1)">&#8249;</button>
  <img class="lightbox-img" id="lb-img" src="" alt="" />
  <div class="lightbox-caption" id="lb-cap"></div>
  <div class="lightbox-dots" id="lb-dots"></div>
  <button class="lightbox-next" onclick="lightboxMove(1)">&#8250;</button>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">物件を追加</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <div class="form-section">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkmtJQhOITvYuB0615DIHc1fd8ju_D3F8",
  authDomain: "ldy-house.firebaseapp.com",
  projectId: "ldy-house",
  storageBucket: "ldy-house.firebasestorage.app",
  messagingSenderId: "1000570179268",
  appId: "1:1000570179268:web:47ebb6b077088f39f88391"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let props = [], editId = null, currentPhotos = [];

// Auth
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    startSync();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
  }
});

window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  document.getElementById('login-err').textContent = '';
  try {
    showLoading(true);
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    document.getElementById('login-err').textContent = 'メールアドレスまたはパスワードが違います';
  }
  showLoading(false);
};

window.doLogout = async function() {
  await signOut(auth);
};

// Enter key login
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });

function startSync() {
  onSnapshot(collection(db, "properties"), snap => {
    props = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    props.sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    renderCards();
  });
}

// Save
window.doSave = async function() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('物件名は必須です'); return; }
  showLoading(true);
  const line = document.getElementById('f-line').value;
  const station = document.getElementById('f-station').value;
  const walk = document.getElementById('f-walk').value;
  const staFree = document.getElementById('f-sta-free').value.trim();
  let sta = '';
  if (line && station) sta = line + '【' + station + '】' + (walk ? '徒歩' + walk + '分' : '');
  if (staFree) sta = sta ? sta + '　' + staFree : staFree;
  const obj = {
    name, sta,
    kind: document.getElementById('f-kind-form').value,
    loc: document.getElementById('f-loc').value.trim(),
    land: parseFloat(document.getElementById('f-land').value)||null,
    floor: parseFloat(document.getElementById('f-floor').value)||null,
    layout: document.getElementById('f-layout').value.trim(),
    price: parseInt(document.getElementById('f-price-val').value)||null,
    built: document.getElementById('f-built').value.trim(),
    yld: parseFloat(document.getElementById('f-yield').value)||null,
    uso: document.getElementById('f-uso').value.trim(),
    struct: document.getElementById('f-struct').value.trim(),
    road: document.getElementById('f-road').value.trim(),
    kenpei: document.getElementById('f-kenpei').value.trim(),
    yoseki: document.getElementById('f-yoseki').value.trim(),
    zone: document.getElementById('f-zone').value,
    saleStatus: document.getElementById('f-sale-status').value,
    propStatus: document.getElementById('f-prop-status').value,
    baitai: document.getElementById('f-baitai-form').value,
    delivery: document.getElementById('f-delivery').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    photos: currentPhotos,
  };
  try {
    if (editId) { await updateDoc(doc(db,'properties',editId), obj); }
    else { obj.createdAt = serverTimestamp(); await addDoc(collection(db,'properties'), obj); }
    closeModal();
  } catch(e) { alert('保存失敗: ' + e.message); }
  showLoading(false);
};

window._firebaseDelete = async function(id) {
  if (!confirm('この物件を削除しますか？')) return;
  await deleteDoc(doc(db,'properties',id));
};

// Photos - Cloudinary
const CLD_CLOUD = 'dujllruro', CLD_PRESET = 'ldy-property';

async function uploadOne(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  const r = await fetch('https://api.cloudinary.com/v1_1/'+CLD_CLOUD+'/image/upload',{method:'POST',body:fd});
  const d = await r.json();
  if (d.secure_url) return { url: d.secure_url, caption: '' };
  throw new Error(d.error?.message||'失敗');
}

window.handleFiles = async function(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  document.getElementById('img-uploading').style.display = 'block';
  for (const file of files) {
    try {
      const photo = await uploadOne(file);
      currentPhotos.push(photo);
      renderImgList();
    } catch(err) { alert('アップロード失敗: ' + err.message); }
  }
  document.getElementById('img-uploading').style.display = 'none';
  document.getElementById('img-file-input').value = '';
};

function renderImgList() {
  const list = document.getElementById('img-list');
  list.innerHTML = currentPhotos.map((p,i) =>
    '<div class="img-item">' +
      '<img src="' + p.url + '" alt="" />' +
      '<div class="img-item-overlay">' +
        '<button class="img-del-btn" onclick="removePhoto(' + i + ')">✕</button>' +
      '</div>' +
      '<input class="img-caption" value="' + (p.caption||'') + '" placeholder="キャプション..." oninput="updateCaption(' + i + ',this.value)" />' +
    '</div>'
  ).join('');
}

window.removePhoto = function(i) { currentPhotos.splice(i,1); renderImgList(); };
window.updateCaption = function(i, v) { if(currentPhotos[i]) currentPhotos[i].caption = v; };

// Drag drop for images
const dropEl = document.getElementById('img-drop');
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('dragover'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('dragover'));
dropEl.addEventListener('drop', async e => {
  e.preventDefault(); dropEl.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  document.getElementById('img-uploading').style.display = 'block';
  for (const file of files) {
    try { const p = await uploadOne(file); currentPhotos.push(p); renderImgList(); }
    catch(err) { alert('失敗: '+err.message); }
  }
  document.getElementById('img-uploading').style.display = 'none';
});

// Lightbox
let lbPhotos = [], lbIdx = 0;
window.openLightbox = function(photos, idx) {
  lbPhotos = photos; lbIdx = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() { document.getElementById('lightbox').classList.remove('open'); };
window.lightboxMove = function(dir) {
  lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
  updateLightbox();
};
function updateLightbox() {
  const p = lbPhotos[lbIdx];
  document.getElementById('lb-img').src = p.url||p;
  document.getElementById('lb-cap').textContent = p.caption||'';
  const dots = document.getElementById('lb-dots');
  dots.innerHTML = lbPhotos.map((_, i) => '<div class="lightbox-dot' + (i===lbIdx?' active':'') + '" onclick="lightboxMove(' + (i-lbIdx) + ')"></div>').join('');
}

const lineEl = document.getElementById('f-line');
const stEl = document.getElementById('f-station');
Object.keys(LINES).forEach(l => {
  const o = document.createElement('option'); o.value=l; o.textContent=l; lineEl.appendChild(o);
});
window.updateStations = function() {
  const line = lineEl.value;
  stEl.innerHTML = '<option value="">駅を選択</option>';
  if (line && LINES[line]) LINES[line].forEach(s => { const o=document.createElement('option');o.value=s;o.textContent=s;stEl.appendChild(o); });
};

    document.getElementById('f-price-val').value=p.price||'';
    document.getElementById('f-built').value=p.built||'';
    document.getElementById('f-yield').value=p.yld||'';
    document.getElementById('f-uso').value=p.uso||'';
    document.getElementById('f-struct').value=p.struct||'';
    document.getElementById('f-road').value=p.road||'';
    document.getElementById('f-kenpei').value=p.kenpei||'';
    document.getElementById('f-yoseki').value=p.yoseki||'';
    document.getElementById('f-zone').value=p.zone||'';
    document.getElementById('f-sale-status').value=p.saleStatus||'販売中';
    document.getElementById('f-prop-status').value=p.propStatus||'空室';
    document.getElementById('f-baitai-form').value=p.baitai||'売主';
    document.getElementById('f-delivery').value=p.delivery||'';
    document.getElementById('f-note').value=p.note||'';
    currentPhotos = p.photos ? JSON.parse(JSON.stringify(p.photos)) : (p.img ? [{url:p.img,caption:''}] : []);
    renderImgList();
  } else {
    ['f-name','f-loc','f-sta-free','f-walk','f-land','f-floor','f-layout','f-price-val','f-built','f-yield','f-uso','f-struct','f-road','f-kenpei','f-yoseki','f-delivery','f-note'].forEach(x=>document.getElementById(x).value='');

};

// Render cards
window.renderCards = function() {
  const kw = document.getElementById('f-keyword').value.trim().toLowerCase();
  const sale = document.getElementById('f-sale').value;
  const prop = document.getElementById('f-prop').value;
  const kind = document.getElementById('f-kind').value;
  const filtered = props.filter(p => {
    if (kw && !(p.name||'').toLowerCase().includes(kw) && !(p.loc||'').toLowerCase().includes(kw) && !(p.sta||'').toLowerCase().includes(kw)) return false;
    if (sale && p.saleStatus!==sale) return false;
    if (prop && p.propStatus!==prop) return false;
    if (kind && p.kind!==kind) return false;
    return true;
  });
  document.getElementById('count-info').textContent = filtered.length+'件表示中 / 全'+props.length+'件';
  document.getElementById('s-total').textContent=props.length;
  document.getElementById('s-sale').textContent=props.filter(p=>p.saleStatus==='販売中').length;
  document.getElementById('s-applied').textContent=props.filter(p=>p.saleStatus==='申込あり').length;
  document.getElementById('s-done').textContent=props.filter(p=>p.saleStatus==='販売済').length;
  document.getElementById('s-empty').textContent=props.filter(p=>p.propStatus&&p.propStatus.includes('空室')).length;
  document.getElementById('s-build').textContent=props.filter(p=>p.propStatus&&p.propStatus.includes('建築')).length;

  const grid = document.getElementById('card-grid');
  if (!filtered.length) { grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#999;font-size:14px;">該当する物件がありません</div>'; return; }
  grid.innerHTML = filtered.map(p => {
    const photos = p.photos && p.photos.length ? p.photos : (p.img ? [{url:p.img,caption:''}] : []);
    const photoHtml = photos.length
      ? '<img src="'+photos[0].url+'" alt="" id="ph-'+p.id+'" style="width:100%;height:100%;object-fit:cover;" />' +
        (photos.length>1 ? '<span class="photo-count">1 / '+photos.length+'</span>' : '') +
        '<button class="photo-prev" onclick="cardPhotoNav(event,\''+p.id+'\','+JSON.stringify(photos).replace(/"/g,'&quot;')+',-1)">&#8249;</button>' +
        '<button class="photo-next" onclick="cardPhotoNav(event,\''+p.id+'\','+JSON.stringify(photos).replace(/"/g,'&quot;')+',1)">&#8250;</button>'
      : '<div class="card-no-photo"><span style="font-size:36px">🏠</span><span>写真なし</span></div>';
    const badgeCls = p.saleStatus==='販売済'?'badge-done':p.saleStatus==='申込あり'?'badge-applied':'badge-sale';
    const propTagCls = p.propStatus&&p.propStatus.includes('空室')?'tag-prop-empty':p.propStatus&&p.propStatus.includes('満室')?'tag-prop-full':p.propStatus&&p.propStatus.includes('賃貸')?'tag-prop-rent':p.propStatus&&p.propStatus.includes('建築')?'tag-prop-build':'tag-prop-other';
    const notes = (p.note||'').split('\n').filter(Boolean);
    const photosJson = JSON.stringify(photos).replace(/"/g,'&quot;');
    return '<div class="prop-card">' +
      '<div class="card-photos" onclick="openLightbox('+photosJson+',0)">' +
        photoHtml +
        '<span class="sale-badge '+badgeCls+'">'+(p.saleStatus||'販売中')+'</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-name">'+(p.name||'')+'</div>' +
        '<div class="card-price">'+(p.price?p.price.toLocaleString()+'万円':'価格応相談')+'<span>'+(p.yld?'利回り'+p.yld+'%':'')+'</span></div>' +
        '<div class="card-tags">' +
          '<span class="tag tag-kind">'+(p.kind||'')+'</span>' +
          '<span class="tag '+propTagCls+'">'+(p.propStatus||'')+'</span>' +
          '<span class="tag" style="background:#eef;color:#335;border:1px solid #ccf;">'+(p.baitai||'')+'</span>' +
        '</div>' +
        '<div class="card-sta"><span class="card-sta-icon">🚃</span><span>'+(p.sta||'—')+'</span></div>' +
        '<div class="card-info">' +
          '<div class="info-row"><span class="info-label">所在地</span><span class="info-val">'+(p.loc||'—')+'</span></div>' +
          '<div class="info-row"><span class="info-label">土地面積</span><span class="info-val">'+(p.land?p.land+'㎡':'—')+'</span></div>' +
          '<div class="info-row"><span class="info-label">延床面積</span><span class="info-val">'+(p.floor?p.floor+'㎡':'—')+'</span></div>' +
          '<div class="info-row"><span class="info-label">間取り</span><span class="info-val">'+(p.layout||'—')+'</span></div>' +
          '<div class="info-row"><span class="info-label">築年月</span><span class="info-val">'+(p.built||'—')+'</span></div>' +
          '<div class="info-row"><span class="info-label">用途地域</span><span class="info-val">'+(p.zone||'—')+'</span></div>' +
        '</div>' +
        (notes.length?'<div class="card-notes"><ol style="padding-left:14px;">'+notes.slice(0,4).map(n=>'<li>'+n+'</li>').join('')+'</ol></div>':'') +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-navy" style="font-size:11px;padding:5px 12px;" onclick="openModal(\''+p.id+'\')">編集</button>' +
        '<button class="btn btn-red" style="font-size:11px;padding:5px 12px;" onclick="window._firebaseDelete(\''+p.id+'\')">削除</button>' +
      '</div>' +
    '</div>';
  }).join('');
};

// Card photo navigation (without opening lightbox)
let cardPhotoIndexes = {};
window.cardPhotoNav = function(e, id, photos, dir) {
  e.stopPropagation();
  if (!cardPhotoIndexes[id]) cardPhotoIndexes[id] = 0;
  cardPhotoIndexes[id] = (cardPhotoIndexes[id] + dir + photos.length) % photos.length;
  const img = document.getElementById('ph-'+id);
  if (img) img.src = photos[cardPhotoIndexes[id]].url;
  const countEl = img && img.parentElement.querySelector('.photo-count');
  if (countEl) countEl.textContent = (cardPhotoIndexes[id]+1) + ' / ' + photos.length;
};

// Print
window.showPrint = function() {
  const kw = document.getElementById('f-keyword').value.trim().toLowerCase();
  const sale = document.getElementById('f-sale').value;
  const prop = document.getElementById('f-prop').value;
  const kind = document.getElementById('f-kind').value;
  const filtered = props.filter(p => {
    if (kw && !(p.name||'').toLowerCase().includes(kw) && !(p.loc||'').toLowerCase().includes(kw)) return false;
    if (sale && p.saleStatus!==sale) return false;
    if (prop && p.propStatus!==prop) return false;
    if (kind && p.kind!==kind) return false;
    return true;
  });
  const pages = [];
  for (let i=0;i<filtered.length;i+=6) pages.push(filtered.slice(i,i+6));

  const ROWS = [
    {key:'price', label:'価格', fmt:p=>p.price?p.price.toLocaleString()+'万円':'—'},
    {key:'img', label:'外観', fmt:null},
    {key:'loc', label:'所在地', fmt:p=>p.loc||'—'},
    {key:'sta', label:'最寄り駅', fmt:p=>p.sta||'—'},
    {key:'uso', label:'用途', fmt:p=>p.uso||'—'},
    {key:'land', label:'土地面積', fmt:p=>p.land?p.land+'㎡':'—'},
    {key:'floor', label:'延床面積', fmt:p=>p.floor?p.floor+'㎡':'—'},
    {key:'layout', label:'間取り', fmt:p=>p.layout||'—'},
    {key:'built', label:'築年月', fmt:p=>p.built||'—'},
    {key:'struct', label:'構造', fmt:p=>p.struct||'—'},
    {key:'road', label:'接道', fmt:p=>p.road||'—'},
    {key:'kenpei_yoseki', label:'建蔽率/容積率', fmt:p=>(p.kenpei?p.kenpei+'%':'—')+'/'+(p.yoseki?p.yoseki+'%':'—')},
    {key:'zone', label:'用途地域', fmt:p=>p.zone||'—'},
    {key:'yld', label:'回利り', fmt:p=>p.yld?p.yld+'%':'—'},
    {key:'propStatus', label:'物件現状', fmt:p=>p.propStatus||'—'},
    {key:'saleStatus', label:'販売状況', fmt:p=>p.saleStatus||'—'},
    {key:'delivery', label:'引渡可能日', fmt:p=>p.delivery||'相談'},
    {key:'baitai', label:'取引業態', fmt:p=>p.baitai||'—'},
    {key:'note', label:'備考', fmt:null},
  ];

  const html = pages.map(page => {
    const colW = Math.floor(220/page.length);
    const tableRows = ROWS.map(row => {
      if (row.key === 'img') {
        const cells = page.map(p => {
          const photos = p.photos&&p.photos.length?p.photos:(p.img?[{url:p.img}]:[]);
          const imgHtml = photos.length ? '<img src="'+photos[0].url+'" style="width:100%;height:55px;object-fit:cover;display:block;" />' : '<div style="height:55px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:7px;color:#aaa;">写真なし</div>';
          const stamp = p.saleStatus==='販売済'?'<div class="print-stamp stamp-done">済</div>':p.saleStatus==='申込あり'?'<div class="print-stamp stamp-applied">申込</div>':'';
          return '<td style="padding:2px;position:relative;">'+imgHtml+stamp+'</td>';
        }).join('');
        return '<tr><td class="row-label">外観</td>'+cells+'</tr>';
      }
      if (row.key === 'note') {
        const cells = page.map(p => {
          const notes = (p.note||'').split('\n').filter(Boolean);
          return '<td style="text-align:left;font-size:6.5px;padding:2px 3px;vertical-align:top;"><ol style="padding-left:8px;line-height:1.5;">'+notes.map(n=>'<li>'+n+'</li>').join('')+'</ol></td>';
        }).join('');
        return '<tr><td class="row-label">備考</td>'+cells+'</tr>';
      }
      if (row.key === 'price') {
        const cells = page.map(p => '<td style="font-size:10px;font-weight:900;color:#C00;text-align:center;">'+row.fmt(p)+'</td>').join('');
        return '<tr><td class="row-label">'+row.label+'</td>'+cells+'</tr>';
      }
      const cells = page.map(p => '<td class="val-cell">'+row.fmt(p)+'</td>').join('');
      return '<tr><td class="row-label">'+row.label+'</td>'+cells+'</tr>';
    }).join('');

    const nameRow = '<tr class="prop-name-row"><th style="background:#f0f2f8;color:var(--navy);font-size:8px;text-align:left;">項目</th>'+page.map(p=>'<th>'+p.name+'</th>').join('')+'</tr>';

    return '<div class="print-page">' +
      '<div class="print-hdr">' +
        '<div class="print-hdr-logo"><span class="print-hdr-lmark">LDY</span><span class="print-hdr-co">株式会社LDY</span></div>' +
        '<div class="print-hdr-ttl">物　件　一　覧　表</div>' +
        '<div class="print-hdr-addr">〒104-0061 東京都中央区銀座8-15-2 ACN銀座ビル9F<br>TEL：03-6260-6811　FAX：03-6260-6812</div>' +
      '</div>' +
      '<div class="print-gold-bar"></div>' +
      '<table class="print-table"><colgroup><col style="width:60px;">'+page.map(()=>'<col style="width:'+colW+'mm;">').join('')+'</colgroup><tbody>'+nameRow+tableRows+'</tbody></table>' +
    '</div>';
  }).join('');

  document.getElementById('print-body').innerHTML = html || '<p style="text-align:center;padding:2rem;color:#999;">表示する物件がありません</p>';
  document.getElementById('printable').innerHTML = html;
  document.getElementById('print-modal').classList.add('open');
};

function showLoading(v) { document.getElementById('loading').className='loading-overlay'+(v?' show':''); }
</script>
</body>
</html>
