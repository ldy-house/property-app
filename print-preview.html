<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>印刷プレビュー｜株式会社LDY</title>
<style>
:root{--navy:#1B2A6B;--navy-dark:#111C4E;--gold:#C9A84C;--gold-light:#E8D08A;--red:#C62828;--green:#1B6B3A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:#888;}

/* 画面表示時のツールバー */
.toolbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--navy-dark),var(--navy));
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;
}
.toolbar span{font-size:13px;font-weight:700;color:#fff;}
.toolbar button{
  font-size:12px;padding:7px 16px;border-radius:4px;border:none;cursor:pointer;font-weight:700;
}
.btn-print{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);}
.btn-close{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3) !important;font-weight:400 !important;}

/* ページコンテナ */
.pages-wrap{padding:14px;}

/* 印刷ページ本体 */
.ppage{
  width:291mm;
  height:204mm;
  background:#fff;
  margin:0 auto 12px;
  padding:4mm;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  overflow:hidden;
}
.phdr{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--navy);padding-bottom:4px;margin-bottom:3px;}
.phdr-logo{display:flex;align-items:center;gap:6px;}
.phdr-lmark{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:3px;}
.phdr-co{font-size:9px;font-weight:700;color:var(--navy);}
.phdr-ttl{font-size:20px;font-weight:900;letter-spacing:5px;color:var(--navy);}
.phdr-addr{font-size:7px;color:#555;text-align:right;line-height:1.7;}
.pgold{height:2px;background:var(--gold);margin-bottom:3px;}

table.ptable{width:100%;border-collapse:collapse;font-size:8px;table-layout:fixed;}
table.ptable td{border:0.5px solid #bbb;padding:2px 3px;vertical-align:middle;line-height:1.4;}



.lbl{background:#F0F2F8;color:var(--navy);font-weight:700;text-align:center;width:54px;font-size:7px;white-space:nowrap;}
.lbl-int{background:#FFF0F0;color:#900;font-weight:700;text-align:center;width:54px;font-size:7px;white-space:nowrap;}
.lbl-ll{background:#F0FFF4;color:var(--green);font-weight:700;text-align:center;width:54px;font-size:7px;white-space:nowrap;}

.name-cell{background-color:#1B2A6B;color:#ffffff;font-weight:700;font-size:9px;text-align:center;padding:4px;}

.price-cell{font-size:12px;font-weight:900;color:var(--red);text-align:center;background:#fff;}

.img-cell{padding:2px;text-align:center;position:relative;background:#fff;}
.img-cell img{width:100%;height:100%;object-fit:contain;display:block;}
.no-img-ph{width:100%;height:100%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:6px;color:#aaa;}

.pstamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:18px;font-weight:900;border:3px solid;border-radius:4px;padding:1px 6px;opacity:0.85;white-space:nowrap;letter-spacing:2px;}
.pst-done{color:#C00;border-color:#C00;}
.pst-applied{color:#c07000;border-color:#c07000;}
.pst-contract{color:#6A1B9A;border-color:#6A1B9A;}

.val{font-size:8px;color:#222;text-align:center;background:#fff;word-break:break-all;}
.val-int{font-size:8px;color:#800;text-align:center;font-weight:600;background:#fff;word-break:break-all;}
.note-val{font-size:8px;color:#333;text-align:left;vertical-align:top;padding:2px 4px;background:#fff;word-break:break-all;overflow:hidden;line-height:1.5;}
.empty-cell{background:#fff;}

/* 印刷時 */
@media print{
  body{background:#fff;}
  .toolbar{display:none !important;}
  .pages-wrap{padding:0;margin:0;}
  .ppage{
    width:291mm;
    height:204mm;
    margin:0 auto;
    padding:4mm;
    box-shadow:none;
    page-break-after:always;
    page-break-inside:avoid;
    overflow:hidden;
  }
  .ppage:last-child{page-break-after:auto;}
  @page{
    size:A4 landscape;
    margin:3mm;
  }
}
</style>
</head>
<body>

<div class="toolbar">
  <span id="pp-title">印刷プレビュー</span>
  <div style="display:flex;gap:8px;">
    <button class="btn-print" onclick="window.print()">🖨 印刷 / PDF保存</button>
    <button class="btn-close" onclick="window.close()">閉じる</button>
  </div>
</div>

<div class="pages-wrap" id="pages-wrap"></div>

<script>
(function(){
  const raw = sessionStorage.getItem('ldy_print_data');
  if (!raw) {
    document.getElementById('pages-wrap').innerHTML = '<p style="text-align:center;padding:3rem;color:#fff;">印刷データが見つかりません。管理画面から再度開いてください。</p>';
    return;
  }
  const data = JSON.parse(raw);
  const { title, pages, rows, internalMap, maskDone } = data;

  const today = new Date();
  const yyyymmdd = today.getFullYear().toString() +
    String(today.getMonth()+1).padStart(2,'0') +
    String(today.getDate()).padStart(2,'0');
  const pageTitle = 'LDY物件一覧_' + yyyymmdd;
  document.getElementById('pp-title').textContent = title + ' 印刷プレビュー';
  document.title = pageTitle;

  function esc(s){
    if (s == null) return '';
    return String(s);
  }

  const html = pages.map(page => {
    const cols = page.length;
    const colW = Math.floor(232 / cols);

    // 204mm - ヘッダー15mm - padding(4mm×2=8mm) - 名前行8mm - 余白3mm = 170mm
    const available = 170;
    const hasImg = rows.some(r => r.type === 'img');
    const hasNote = rows.some(r => r.type === 'note');
    const dataRowCount = rows.length;

    // img行=3倍、note行=4倍、通常行=1倍で重み付け均等割り
    const imgWeight = hasImg ? 5 : 0;
    const noteWeight = hasNote ? 4 : 0;
    const normalCount = dataRowCount - (hasImg ? 1 : 0) - (hasNote ? 1 : 0);
    const totalWeight = normalCount + imgWeight + noteWeight;
    const unitMm = totalWeight > 0 ? available / totalWeight : 5;

    const imgH = hasImg ? Math.max(30, unitMm * 5) : 0;
    const noteH = hasNote ? Math.max(20, unitMm * 4) : 0;
    const normalH = Math.max(2.5, unitMm);

    const nameRow = '<tr style="height:8mm;"><td class="lbl" style="font-size:6px;">物件名</td>' +
      page.map(p => '<td class="name-cell" style="font-size:' + (p.name.length > 12 ? '7' : '9') + 'px;">' + esc(p.name) + '</td>').join('') +
      '</tr>';

    const dataRows = rows.map(row => {
      const isImg = row.type === 'img';
      const isNote = row.type === 'note';
      const rowH = (isImg ? imgH : isNote ? noteH : normalH) + 'mm';
      let tr = '<tr style="height:' + rowH + ';">' +
        '<td class="' + (row.internal ? 'lbl-int' : row.type === 'll' ? 'lbl-ll' : 'lbl') + '">' + esc(row.label) + '</td>';
      for (let c = 0; c < page.length; c++) {
        const p = page[c];
        const int = internalMap[p.id] || {};
        const isDone = p.saleStatus === '販売済' || p.saleStatus === '契約済';
        if (row.type === 'price') {
          const pv = p.price ? p.price.toLocaleString() + '万円' : '—';
          tr += '<td class="price-cell">' + (isDone && maskDone ? '＊＊＊＊万円' : pv) + '</td>';
        } else if (row.type === 'img') {
          const photos = (p.photos && p.photos.length) ? p.photos : (p.img ? [{ url: p.img }] : []);
          const imgHtml = photos.length
            ? '<img src="' + esc(photos[0].url) + '" style="height:' + imgH + 'mm;"/>'
            : '<div class="no-img-ph" style="height:' + imgH + 'mm;">写真なし</div>';
          const stamp = p.saleStatus === '販売済' ? '<div class="pstamp pst-done">済</div>'
            : p.saleStatus === '申込あり' ? '<div class="pstamp pst-applied">申込</div>'
            : p.saleStatus === '契約済' ? '<div class="pstamp pst-contract">契約</div>' : '';
          tr += '<td class="img-cell" style="height:' + imgH + 'mm;">' + imgHtml + stamp + '</td>';
        } else if (row.type === 'note') {
          const notes = (p.note || '').split('\n').filter(Boolean);
          tr += '<td class="note-val"><ol style="padding-left:8px;">' + notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol></td>';
        } else if (row.type === 'll') {
          tr += '<td class="val" style="text-align:left;">' + esc(row.valueMap ? row.valueMap[p.id] : '—') + '</td>';
        } else {
          tr += '<td class="' + (row.internal ? 'val-int' : 'val') + '">' + esc(row.valueMap ? row.valueMap[p.id] : '—') + '</td>';
        }
      }
      tr += '</tr>';
      return tr;
    }).join('');

    return '<div class="ppage">' +
      '<div class="phdr">' +
        '<div class="phdr-logo"><span class="phdr-lmark">LDY</span><span class="phdr-co">株式会社LDY</span></div>' +
        '<div class="phdr-ttl">' + esc(title) + '</div>' +
        '<div class="phdr-addr">〒104-0061 東京都中央区銀座8-15-2 ACN銀座ビル9F<br>TEL：03-6260-6811　FAX：03-6260-6812</div>' +
      '</div>' +
      '<div class="pgold"></div>' +
      '<table class="ptable"><colgroup><col style="width:54px;">' + page.map(() => '<col style="width:' + colW + 'mm;">').join('') + '</colgroup>' +
      '<tbody>' + nameRow + dataRows + '</tbody></table>' +
    '</div>';
  }).join('');

  document.getElementById('pages-wrap').innerHTML = html || '<p style="text-align:center;padding:3rem;color:#fff;">物件がありません</p>';

  // 画像読み込み完了後に備考セルのフォントを自動縮小
  function shrinkNotes() {
    document.querySelectorAll('.note-val').forEach(cell => {
      let fontSize = 8;
      cell.style.fontSize = fontSize + 'px';
      cell.style.lineHeight = '1.4';
      // セルの高さが固定されているので scrollHeight > clientHeight で判定
      let tries = 0;
      while (cell.scrollHeight > cell.clientHeight + 1 && fontSize > 4 && tries < 30) {
        fontSize -= 0.3;
        cell.style.fontSize = fontSize + 'px';
        tries++;
      }
    });
  }

  // 画像が全部読み込まれてから実行
  const imgs = document.querySelectorAll('.pages-wrap img');
  if (imgs.length === 0) {
    setTimeout(shrinkNotes, 100);
  } else {
    let loaded = 0;
    const onLoad = () => { loaded++; if (loaded >= imgs.length) setTimeout(shrinkNotes, 50); };
    imgs.forEach(img => {
      if (img.complete) onLoad();
      else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
    });
    // 最大3秒待ってタイムアウト
    setTimeout(shrinkNotes, 3000);
  }
})();
</script>
</body>
</html>
