<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>印刷プレビュー｜株式会社LDY</title>
<style>
:root{--navy:#1B2A6B;--navy-dark:#111C4E;--gold:#C9A84C;--gold-light:#E8D08A;--red:#C62828;--green:#1B6B3A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:#888;}
.toolbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy-dark),var(--navy));padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
.toolbar span{font-size:13px;font-weight:700;color:#fff;}
.toolbar button{font-size:12px;padding:7px 16px;border-radius:4px;border:none;cursor:pointer;font-weight:700;}
.btn-print{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);}
.btn-close{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3)!important;font-weight:400!important;}
.pages-wrap{padding:14px;}
.ppage{width:291mm;height:204mm;background:#fff;margin:0 auto 12px;padding:4mm;box-shadow:0 2px 8px rgba(0,0,0,0.15);overflow:hidden;}
.phdr{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--navy);padding-bottom:4px;margin-bottom:3px;}
.phdr-logo{display:flex;align-items:center;gap:6px;}
.phdr-lmark{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:3px;}
.phdr-co{font-size:9px;font-weight:700;color:var(--navy);}
.phdr-ttl{font-size:20px;font-weight:900;letter-spacing:5px;color:var(--navy);}
.phdr-addr{font-size:7px;color:#555;text-align:right;line-height:1.7;}
.pgold{height:2px;background:var(--gold);margin-bottom:3px;}
.ptable{width:100%;border-collapse:collapse;table-layout:fixed;}
.ptable td{border:0.5px solid #bbb;padding:2px 3px;vertical-align:middle;overflow:hidden;}
.lbl{background:#F0F2F8;color:var(--navy);font-weight:700;text-align:center;white-space:nowrap;}
.lbl-int{background:#FFF0F0;color:#900;font-weight:700;text-align:center;white-space:nowrap;}
.lbl-ll{background:#F0FFF4;color:var(--green);font-weight:700;text-align:center;white-space:nowrap;}
.name-cell{background-color:#1B2A6B;color:#ffffff;font-weight:700;text-align:center;padding:4px;}
.price-cell{font-weight:900;color:var(--red);text-align:center;}
.img-cell{padding:2px;text-align:center;position:relative;}
.img-cell img{width:100%;height:100%;object-fit:contain;display:block;}
.no-img-ph{width:100%;height:100%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#aaa;}
.pstamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:18px;font-weight:900;border:3px solid;border-radius:4px;padding:1px 6px;opacity:0.85;white-space:nowrap;letter-spacing:2px;}
.pst-done{color:#C00;border-color:#C00;}
.pst-applied{color:#c07000;border-color:#c07000;}
.pst-contract{color:#6A1B9A;border-color:#6A1B9A;}
.val{color:#222;text-align:center;word-break:break-all;}
.val-int{color:#800;text-align:center;font-weight:600;word-break:break-all;}
.note-val{color:#333;text-align:left;vertical-align:top;word-break:break-all;}
@media print{
  body{background:#fff;}
  .toolbar{display:none!important;}
  .pages-wrap{padding:0;margin:0;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .ppage{width:291mm;height:204mm;margin:0 auto;padding:4mm;box-shadow:none;page-break-after:always;page-break-inside:avoid;overflow:hidden;}
  .ppage:last-child{page-break-after:auto;}
  @page{size:A4 landscape;margin:3mm;}
}
</style>
</head>
<body>
<div class="toolbar">
  <span id="pp-title">印刷プレビュー</span>
  <div style="display:flex;gap:8px;">
    <button class="btn-print" onclick="window.print()">🖨 印刷 / PDF保存</button>
    <button class="btn-close" onclick="window.close()">閉じる</button>
  </div>
</div>
<div class="pages-wrap" id="pages-wrap"></div>
<script>
(function(){
  const raw = sessionStorage.getItem('ldy_print_data');
  if(!raw){
    document.getElementById('pages-wrap').innerHTML='<p style="text-align:center;padding:3rem;color:#fff;">データが見つかりません。管理画面から再度開いてください。</p>';
    return;
  }
  const {title,pages,rows,internalMap,maskDone} = JSON.parse(raw);

  const today = new Date();
  const yyyymmdd = today.getFullYear()+String(today.getMonth()+1).padStart(2,'0')+String(today.getDate()).padStart(2,'0');
  const dateStr = today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';
  document.getElementById('pp-title').textContent = title+' 印刷プレビュー';
  document.title = 'LDY物件一覧_'+yyyymmdd;

  function esc(s){ return s==null?'':String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const html = pages.map(page => {
    const cols = page.length;
    const colW = Math.floor(232/cols);

    // ── 高さ配分 ──────────────────────────────
    // ppage内側高さ = 204mm - padding(4mm×2) = 196mm
    // phdr ≒ 14mm、pgold ≒ 3mm → テーブル使用可能 = 179mm
    // うち nameRow = 8mm → dataRows使用可能 = 171mm
    const tableH = 171; // mm

    const hasImg  = rows.some(r=>r.type==='img');
    const hasNote = rows.some(r=>r.type==='note');
    const normalCount = rows.length - (hasImg?1:0) - (hasNote?1:0);

    // 外観・備考は固定、残りを通常行で均等割り
    const imgH  = hasImg  ? 32 : 0;
    const noteH = hasNote ? 26 : 0;
    const remaining = tableH - imgH - noteH;
    const normalH = normalCount > 0 ? Math.max(2.5, remaining/normalCount) : 4;

    // ── フォントサイズ（normalHに比例）────────
    const lf  = Math.max(5,  Math.min(7.5, normalH*1.4)); // ラベル
    const vf  = Math.max(5.5,Math.min(9,   normalH*1.6)); // 値
    const nf  = Math.max(7,  Math.min(11,  normalH*2.0)); // 物件名
    const pf  = Math.max(8,  Math.min(13,  normalH*2.2)); // 価格
    const notef = 6; // 備考は固定

    // ── nameRow ───────────────────────────────
    const nameRow =
      '<tr style="height:8mm;">'+
        '<td class="lbl" style="font-size:'+lf+'px;width:54px;">物件名</td>'+
        page.map(p=>'<td class="name-cell" style="font-size:'+(p.name.length>10?nf*0.82:nf)+'px;">'+esc(p.name)+'</td>').join('')+
      '</tr>';

    // ── dataRows ──────────────────────────────
    const dataRows = rows.map(row=>{
      const isImg  = row.type==='img';
      const isNote = row.type==='note';
      const isPrice= row.type==='price';
      const rh = (isImg?imgH:isNote?noteH:normalH)+'mm';
      const lblClass = row.internal?'lbl-int':row.type==='ll'?'lbl-ll':'lbl';

      let tr='<tr style="height:'+rh+';">'+
        '<td class="'+lblClass+'" style="font-size:'+lf+'px;width:54px;">'+esc(row.label)+'</td>';

      page.forEach(p=>{
        const intData = (internalMap&&internalMap[p.id])||{};
        const isDone  = p.saleStatus==='販売済'||p.saleStatus==='契約済';

        if(isPrice){
          const pv = p.price?p.price.toLocaleString()+'万円':'—';
          tr+='<td class="price-cell" style="font-size:'+pf+'px;">'+(isDone&&maskDone?'＊＊＊＊万円':pv)+'</td>';

        }else if(isImg){
          const photos=(p.photos&&p.photos.length)?p.photos:(p.img?[{url:p.img}]:[]);
          const imgHtml=photos.length
            ?'<img src="'+esc(photos[0].url)+'" style="width:100%;height:'+imgH+'mm;object-fit:contain;display:block;"/>'
            :'<div class="no-img-ph" style="height:'+imgH+'mm;font-size:6px;">写真なし</div>';
          const stamp=p.saleStatus==='販売済'?'<div class="pstamp pst-done">済</div>'
            :p.saleStatus==='申込あり'?'<div class="pstamp pst-applied">申込</div>'
            :p.saleStatus==='契約済'?'<div class="pstamp pst-contract">契約</div>':'';
          tr+='<td class="img-cell" style="height:'+imgH+'mm;">'+imgHtml+stamp+'</td>';

        }else if(isNote){
          const notes=(p.note||'').split('\n').filter(Boolean);
          tr+='<td class="note-val" style="font-size:'+notef+'px;height:'+noteH+'mm;max-height:'+noteH+'mm;overflow:hidden;"><ol style="padding-left:8px;">'+
            notes.map(n=>'<li>'+esc(n)+'</li>').join('')+
          '</ol></td>';

        }else{
          const val=row.valueMap?esc(row.valueMap[p.id]||'—'):'—';
          const cls=row.internal?'val-int':'val';
          tr+='<td class="'+cls+'" style="font-size:'+vf+'px;">'+val+'</td>';
        }
      });

      tr+='</tr>';
      return tr;
    }).join('');

    return '<div class="ppage">'+
      '<div class="phdr">'+
        '<div class="phdr-logo"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAj8AAACgCAYAAADjAw2IAAAosUlEQVR4nO3d+58jZb0n8E/3a37vHN3oOd46c2RBvKSD54jDRTrNTZDLBFdhEKRr1KOGi1N43d+m+rf1nN1DGoRGvEy1jiLsWUkzIDeHrgwzgHqU6lYYYYGpeMRd7FWTf8Bnf6gnM5l0kro9dUn68+aV19CdyvN8qzpJfet5nnqeCSEExk3rJb2QO7XmpB0HERERZc/EOCU/rZf0MoAagBkACwBquVNrrRRDIiIioowZi+Sn9eKeHNykZ77nqSYAPXfaYj3hkIiIiCijRj75+cuLe3QABoCpIZutAND/5rRFJ4GQiIiIKMNGNvn582/3lHGii8uPNoDaG961aMQUEhEREY2AkUt+/vzbL+TQv4vLryYA7Q3vut1SFBIRERGNkJFKfv589As6vLu4/FoBoL3h9NtbCsoiIiKiETESyc+fXvhCGcG6uPxqAzDe+O7ba4rLJSIioozKdPLzpxcid3H5tQZAf+O72RVGREQ07jKb/PzphVt0qOvi8msZgP7Gd9/RSrBOIiIiSlDmkp//9/wtZQAmgOmUQmgD0P/Te+4wU6qfiIiIYpSZ5GfjNzcX4HZx7YxYVFv+G7XFqAFAz7/3G3bEcoiIiChDMpH8bPz6JgOAjugJyyLcrjJA3VihRQBG/n13thSURURERClLNfn5469vKkNNF1cDgP6m991p9ym/huh3iTVl+fWI5RAREVHKUkl+/vjrmwpQ08XVBGC86X13mh716VAzeLoBQHvT++50IpZDREREKUk8+fnjurIurgUAtTcV/XVH/XH9phzUdYUFqpuIiIiyI7Hk5/W1G8tQ18WlvXnmLiflOJoyDitiOURERJSg2JOf19duLEBdF5f+5pm76hHLAQC8vnajATUtUCtw43IilkNEREQJmIyz8NftGw0I2BDYCQGEfLQhsPDmmbsKQRKf1+0b9WHPv3nmLgMCJQisRIgNct/s1+0bDb+xERERUXpiafn5v3a1DDVdSysA9L8tLTkhYhCQXVN/W1qyPLYtQ2FXmFd9RERElB6lyc//ee7zBajr4tL+7oy7rQixdO/YCgD978642/F4jQE1XWHLsr5WxHKIiIhIMWXJj6LEoQ3A+Lsz7q4piKffji0AqA1LShQmcMr2hYiIiNSJnPz84VefL0NNl9EyAP0t71fTWvKHX/VNfgA5cPot77+77vH6MtTs1xoA7S3vv9uOWA4REREpEDr5+cOvPleAmxzMRoxhDYD+lvd/04pYzkn+8KvPee1YQ9Zre5RjANirIKRFAMZb3v/NloKyiIiIKKTAyc8ffvW5HNzuragJQRtuMlCLWE5fPpKfDs+kRGGi14abcJkRyyEiIqKQAiU/r/3ycxW442GidgUtAjDe+g/xtYK89kvfyQ8gk5K3/sPwpETh/jdkfXbEcoiIiCggX8nPa//+2QLUtHy4J/1/vMeOWI6n1/79s2H689bgxmcNKTcHNS1fgByA/dZ/vKeloCwiIiLyYWjy89ovlJ3o3ZaVD9xjRizHt9d+ESr56VgGYLz1A/c4Q8ovQE1C2IR7bOoRyyEiIiIfBiY/v//FZytQ08WzAKD2tg8k27rx+2jJD+AmbLW3feAew6OeCtR1hWlvG5JwERERUXSbkp/f//yfClDXxaW97cxvORHLCeX3P/8nVbM3NuHuhzWkrhwUdoW97cxvGQrKISIioj6OJz//8fPP5KDmBN4EoL/9zG/XI5YTyX/8/DOq1+1oANDefua3nSF1FqCuK0x7+5nftiKWQ0RERD0mhBD43c8+U0H0rpu2LKP2jg9+uxU5soh+9zPlyU/HAjz28Xc/+4wG91goWTH+HR8cnHARERFRMBPNZz9tIXpLReZO0jEmP4DbMmO844PfNofUnwNgANgTsa62
