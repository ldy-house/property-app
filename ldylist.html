<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>物件検索｜株式会社LDY</title>
<meta name="description" content="株式会社LDYの取扱物件一覧。東京都内の収益物件・投資用不動産・一棟もの・区分マンション・土地を掲載。"/>
<style>
:root{
  --navy:#1B2A6B;--navy-dark:#111C4E;--gold:#C9A84C;--gold-light:#E8D08A;
  --white:#fff;--bg:#F5F6FA;--border:#E0E0E8;--text:#1a1a2e;--sub:#777;--red:#C62828;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* 検索バー */
.search-wrap{background:#fff;border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(27,42,107,0.08);}
.search-input-wrap{display:flex;flex:1;min-width:220px;border:1.5px solid var(--border);border-radius:4px;overflow:hidden;transition:border-color 0.15s;}
.search-input-wrap:focus-within{border-color:var(--navy);}
.search-input{flex:1;padding:9px 14px;font-size:14px;border:none;outline:none;font-family:inherit;color:var(--text);}
.search-btn{padding:9px 20px;background:linear-gradient(135deg,var(--gold-light),var(--gold));border:none;font-size:13px;font-weight:700;color:var(--navy-dark);cursor:pointer;white-space:nowrap;}
.search-btn:hover{opacity:0.88;}
.filter-selects{display:flex;gap:8px;flex-wrap:wrap;}
.filter-selects select{font-size:12px;padding:8px 12px;border:1.5px solid var(--border);border-radius:4px;background:#fff;outline:none;color:var(--text);cursor:pointer;}
.filter-selects select:focus{border-color:var(--navy);}
.result-count{font-size:12px;color:var(--sub);white-space:nowrap;padding:4px 0;}

/* カードグリッド */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 20px;}

/* カード：高さ統一のためflexレイアウト */
.prop-card{
  background:#fff;border-radius:6px;border:1px solid var(--border);
  overflow:hidden;transition:box-shadow 0.2s,transform 0.15s;
  display:flex;flex-direction:column;
}
.prop-card:hover{box-shadow:0 6px 24px rgba(27,42,107,0.13);transform:translateY(-2px);}

/* 写真エリア：固定高さ・contain */
.card-photos{
  position:relative;
  height:220px;
  flex-shrink:0;
  background:#f2f2f4;overflow:hidden;cursor:pointer;
}
.card-photos img{width:100%;height:100%;object-fit:contain;background:#f2f2f4;display:block;}
.card-no-photo{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;gap:8px;background:#f2f2f4;font-size:13px;}
.photo-count{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.5);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;}
.photo-arrows{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;opacity:0;transition:opacity 0.2s;}
.card-photos:hover .photo-arrows{opacity:1;}
.photo-btn{background:rgba(0,0,0,0.4);color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
.photo-btn:hover{background:rgba(0,0,0,0.65);}
.sale-badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.5px;}
.badge-sale{background:var(--navy);color:#fff;}
.badge-applied{background:#D84315;color:#fff;}
.badge-contract{background:#6A1B9A;color:#fff;}

/* カード本文：flexで伸縮 */
.card-body{padding:14px 16px;display:flex;flex-direction:column;flex:1;}
.card-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.35;}
.card-price{font-size:20px;font-weight:700;color:var(--red);margin-bottom:6px;display:flex;align-items:baseline;gap:8px;min-height:32px;}
.card-price-unit{font-size:13px;font-weight:400;color:var(--sub);}
.card-yield{font-size:12px;color:var(--sub);}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:600;white-space:nowrap;}
.tag-kind{background:#EEF2FF;color:var(--navy);border:1px solid #C7D2FE;}
.tag-empty{background:#FFF9C4;color:#7B6000;}
.tag-rent{background:#E3F2FD;color:#1565C0;}
.tag-full{background:#E8F5E9;color:#2E7D32;}
.tag-build{background:#EDE7F6;color:#4527A0;}
.tag-contract{background:#F3E5F5;color:#6A1B9A;}
.tag-other{background:#F5F5F5;color:#666;}
.card-sta{font-size:11px;color:var(--sub);margin-bottom:8px;line-height:1.6;}
.card-divider{height:1px;background:var(--border);margin:8px 0;flex-shrink:0;}
.card-specs{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:11px;margin-bottom:8px;}
.spec-row{display:flex;gap:5px;}
.spec-label{color:var(--sub);min-width:50px;flex-shrink:0;}
.spec-val{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 備考：flex:1で残りスペースを埋める→カード高さ統一 */
.card-notes{font-size:11px;color:var(--sub);flex:1;margin-bottom:8px;}
.card-notes ul{padding-left:14px;line-height:1.9;}

/* 問い合わせボタン：常にカード最下部 */
.card-contact{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.btn-tel{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;padding:9px 12px;border-radius:4px;text-decoration:none;white-space:nowrap;}
.btn-tel:hover{background:var(--navy-dark);}
.btn-mail{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--navy-dark);font-weight:700;font-size:12px;padding:9px 12px;border-radius:4px;text-decoration:none;white-space:nowrap;}
.btn-mail:hover{opacity:0.88;}

.empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
.empty-text{font-size:15px;font-weight:500;margin-bottom:6px;}
.empty-sub{font-size:13px;}

/* ライトボックス */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.open{display:flex;}
.lightbox-img{max-width:90vw;max-height:78vh;object-fit:contain;border-radius:3px;display:block;background:#111;}
.lightbox-caption{color:rgba(255,255,255,0.7);font-size:13px;margin-top:10px;text-align:center;max-width:600px;}
.lightbox-close{position:absolute;top:14px;right:18px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:0.7;}
.lightbox-close:hover{opacity:1;}
.lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:24px;padding:12px 16px;cursor:pointer;border-radius:4px;}
.lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,0.3);}
.lightbox-prev{left:14px;}.lightbox-next{right:14px;}
.lightbox-dots{display:flex;gap:6px;margin-top:12px;}
.lb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);cursor:pointer;}
.lb-dot.active{background:#fff;}
.lightbox-counter{position:absolute;top:14px;left:18px;color:rgba(255,255,255,0.55);font-size:12px;}

.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:14px;color:var(--sub);}
.spinner{width:36px;height:36px;border:3px solid #ddd;border-top:3px solid var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="search-wrap">
  <div class="search-input-wrap">
    <input type="text" class="search-input" id="search-input" placeholder="物件名・エリア・駅名などで検索..." oninput="filterCards()"/>
    <button class="search-btn" onclick="filterCards()">検索</button>
  </div>
  <div class="filter-selects">
    <select id="f-kind" onchange="filterCards()">
      <option value="">種別：すべて</option>
      <option>一棟もの</option><option>一戸建て</option><option>土地</option><option>区分マンション</option>
    </select>
    <select id="f-prop" onchange="filterCards()">
      <option value="">現状：すべて</option>
      <option>空室</option><option>賃貸中</option><option>満室賃貸中</option><option>建築中</option><option>古屋有</option><option>更地</option>
    </select>
  </div>
  <span class="result-count" id="result-info"></span>
</div>
<div id="card-grid">
  <div class="page-loading"><div class="spinner"></div><div>物件情報を読み込み中...</div></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <span class="lightbox-counter" id="lb-counter"></span>
  <button class="lightbox-prev" onclick="lbMove(-1)">&#8249;</button>
  <img class="lightbox-img" id="lb-img" src="" alt=""/>
  <button class="lightbox-next" onclick="lbMove(1)">&#8250;</button>
  <div class="lightbox-caption" id="lb-cap"></div>
  <div class="lightbox-dots" id="lb-dots"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkmtJQhOITvYuB0615DIHc1fd8ju_D3F8",
  authDomain: "ldy-house.firebaseapp.com",
  projectId: "ldy-house",
  storageBucket: "ldy-house.firebasestorage.app",
  messagingSenderId: "1000570179268",
  appId: "1:1000570179268:web:47ebb6b077088f39f88391"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProps = [];

onSnapshot(collection(db, 'properties'), snap => {
  allProps = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    // 販売済のみ非表示。契約済・申込あり・販売中はすべて表示
    .filter(p =>  p.saleStatus !== '販売済' &&
      p.saleStatus !== '契約済')
    .sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  filterCards();
});

window.filterCards = function() {
  const kw = (document.getElementById('search-input').value||'').trim().toLowerCase();
  const kind = document.getElementById('f-kind').value;
  const prop = document.getElementById('f-prop').value;
  const price = document.getElementById('f-price').value;

  const filtered = allProps.filter(p => {
    if (kw) {
      const t = [(p.name||''),(p.loc||''),(p.sta||''),(p.kind||''),(p.uso||''),(p.zone||''),(p.layout||''),(p.note||'')].join(' ').toLowerCase();
      if (!t.includes(kw)) return false;
    }
    if (kind && p.kind !== kind) return false;
    if (prop && p.propStatus !== prop) return false;
    if (price) {
      const [lo, hi] = price.split('-');
      const v = p.price || 0;
      if (hi===undefined||hi==='') { if (v < Number(lo)) return false; }
      else { if (v < Number(lo) || v >= Number(hi)) return false; }
    }
    return true;
  });

  document.getElementById('result-info').textContent = filtered.length + '件';
  renderCards(filtered);
};

function propTagClass(s) {
  if (!s) return 'tag-other';
  if (s.includes('満室')) return 'tag-full';
  if (s.includes('賃貸')) return 'tag-rent';
  if (s.includes('空室')) return 'tag-empty';
  if (s.includes('建築')) return 'tag-build';
  if (s === '契約済') return 'tag-contract';
  return 'tag-other';
}

function badgeClass(s) {
  if (s === '申込あり') return 'badge-applied';
  if (s === '契約済') return 'badge-contract';
  return 'badge-sale';
}

let cardPhotoIdx = {};

function renderCards(list) {
  const grid = document.getElementById('card-grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-text">条件に一致する物件が見つかりません</div><div class="empty-sub">検索キーワードや絞り込み条件を変えてみてください</div></div>';
    return;
  }
  grid.innerHTML = '<div class="card-grid">' + list.map(p => {
    const photos = p.photos&&p.photos.length ? p.photos : (p.img?[{url:p.img,caption:''}]:[]);
    const pj = JSON.stringify(photos).replace(/\\/g,'\\\\').replace(/"/g,'&quot;');
    const mailSub = encodeURIComponent('物件についてのお問い合わせ（'+(p.name||'')+'）');
    const mailBody = encodeURIComponent('物件名：'+(p.name||'')+'\n\nお名前：\nご連絡先：\n\nお問い合わせ内容：');
    const isContract = p.saleStatus === '契約済';

    const photoArea = photos.length
      ? '<img src="'+photos[0].url+'" alt="'+(p.name||'')+'" id="cimg-'+p.id+'" style="width:100%;height:100%;object-fit:contain;background:#f2f2f4;display:block;"/>'+
        (photos.length>1
          ? '<div class="photo-arrows">'+
              '<button class="photo-btn" onclick="cardNav(event,\''+p.id+'\','+pj+',-1)">&#8249;</button>'+
              '<button class="photo-btn" onclick="cardNav(event,\''+p.id+'\','+pj+',1)">&#8250;</button>'+
            '</div><span class="photo-count" id="cnt-'+p.id+'">1 / '+photos.length+'</span>'
          : '')
      : '<div class="card-no-photo"><span style="font-size:32px;opacity:0.3;">&#127968;</span><span>写真なし</span></div>';

    const notes = (p.note||'').split('\n').filter(Boolean);

    // 契約済は価格を隠す
const priceHtml = true
  ? '<span style="font-size:15px;color:var(--sub);">価格非公開</span>'
  : '';
     // : (p.price ? p.price.toLocaleString()+'<span class="card-price-unit">万円</span>'+(p.yld?'<span class="card-yield">利回り '+p.yld+'%</span>':'') : '<span style="font-size:15px;">価格応相談</span>');

    return '<div class="prop-card">'+
      '<div class="card-photos" onclick="openLB('+pj+',0)">'+
        photoArea+
        '<span class="sale-badge '+badgeClass(p.saleStatus)+'">'+(p.saleStatus||'販売中')+'</span>'+
      '</div>'+
      '<div class="card-body">'+
        '<div class="card-name">'+(p.name||'')+'</div>'+
        '<div class="card-price">'+priceHtml+'</div>'+
        '<div class="card-tags">'+
          '<span class="tag tag-kind">'+(p.kind||'')+'</span>'+
          (p.propStatus?'<span class="tag '+propTagClass(p.propStatus)+'">'+(p.propStatus)+'</span>':'')+
        '</div>'+
        '<div class="card-sta">'+(p.sta||'—')+'</div>'+
        '<div class="card-divider"></div>'+
        '<div class="card-specs">'+
          '<div class="spec-row"><span class="spec-label">所在地</span><span class="spec-val">'+(p.loc||'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">土地面積</span><span class="spec-val">'+(p.land?p.land+'㎡':'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">延床面積</span><span class="spec-val">'+(p.floor?p.floor+'㎡':'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">間取り</span><span class="spec-val">'+(p.layout||'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">築年月</span><span class="spec-val">'+(p.built||'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">構造</span><span class="spec-val">'+(p.struct||'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">建蔽率</span><span class="spec-val">'+(p.kenpei?p.kenpei+'%':'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">容積率</span><span class="spec-val">'+(p.yoseki?p.yoseki+'%':'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">用途地域</span><span class="spec-val">'+(p.zone||'—')+'</span></div>'+
          '<div class="spec-row"><span class="spec-label">取引業態</span><span class="spec-val">'+(p.baitai||'—')+'</span></div>'+
        '</div>'+
        // 備考：flex:1で高さを埋める
        '<div class="card-notes">'+
          (notes.length?'<ul>'+notes.map(n=>'<li>'+n+'</li>').join('')+'</ul>':'<div style="height:8px;"></div>')+
        '</div>'+
        '<div class="card-contact">'+
          '<a href="tel:0362606811" class="btn-tel">電話で問い合わせる</a>'+
          '<a href="mailto:info@ldy-house.com?subject='+mailSub+'&body='+mailBody+'" class="btn-mail">メールで問い合わせる</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('')+'</div>';
}

window.cardNav = function(e,id,photos,dir) {
  e.stopPropagation();
  if (!cardPhotoIdx[id]) cardPhotoIdx[id]=0;
  cardPhotoIdx[id]=(cardPhotoIdx[id]+dir+photos.length)%photos.length;
  const img=document.getElementById('cimg-'+id); if(img) img.src=photos[cardPhotoIdx[id]].url;
  const cnt=document.getElementById('cnt-'+id); if(cnt) cnt.textContent=(cardPhotoIdx[id]+1)+' / '+photos.length;
};

let lbPhotos=[], lbIdx=0;
window.openLB = function(photos,idx) {
  if (!photos.length) return;
  lbPhotos=photos; lbIdx=idx; updateLB();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
};
window.lbMove = function(dir) { lbIdx=(lbIdx+dir+lbPhotos.length)%lbPhotos.length; updateLB(); };
function updateLB() {
  const p=lbPhotos[lbIdx];
  document.getElementById('lb-img').src=p.url||p;
  document.getElementById('lb-cap').textContent=p.caption||'';
  document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+lbPhotos.length;
  document.getElementById('lb-dots').innerHTML=lbPhotos.map((_,i)=>
    '<div class="lb-dot'+(i===lbIdx?' active':'')+'" onclick="lbMove('+(i-lbIdx)+')"></div>'
  ).join('');
}
document.addEventListener('keydown', e=>{
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key==='ArrowLeft') lbMove(-1);
  if (e.key==='ArrowRight') lbMove(1);
  if (e.key==='Escape') closeLightbox();
});
document.getElementById('search-input').addEventListener('keydown', e=>{ if(e.key==='Enter') filterCards(); });
</script>
</body>
</html>
