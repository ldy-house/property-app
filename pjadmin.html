<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>開発管理｜株式会社LDY</title>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
:root{--navy:#1B2A6B;--navy-dark:#111C4E;--gold:#C9A84C;--bg:#F5F4F0;--white:#FAFAF8;--text:#1a1a2e;--sub:#6B6560;--line:rgba(27,42,107,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.nav{background:var(--navy-dark);display:flex;gap:4px;padding:0 20px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50;overflow-x:auto}
.nav a{color:rgba(255,255,255,.65);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:1px;padding:15px 18px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.nav a:hover{color:#fff}
.nav a.on{color:var(--gold);border-bottom-color:var(--gold)}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 120px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 16px;border:1px solid var(--line);background:var(--white);border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;margin:10px 0 4px}
input[type=text],select,textarea{width:100%;padding:9px 10px;border:1px solid #d6d3cb;border-radius:4px;font:inherit;background:#fff}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fff;transition:.15s}
.step.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.2)}
.step.over{background:#fffbe9;border-color:var(--gold)}
.step-head{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center}
.btn{border:none;border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn-p{background:var(--navy);color:#fff}.btn-g{background:var(--gold);color:var(--navy-dark)}
.btn-s{background:#eee;color:#555;padding:7px 10px;font-size:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:#ddd;cursor:grab;border:2px solid transparent}
.ph.drop{border-color:var(--gold)}.ph.drag{opacity:.35}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
.ph .x{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer}
.ph input{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 5px;width:100%}
.ph.up{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.hint{font-size:11px;color:var(--sub);margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:flex-end;align-items:center;gap:14px;z-index:40}
#msg{font-size:12px;color:var(--sub)}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:80vh;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:24px;padding:12px 16px;cursor:pointer;border-radius:4px}
.lb .c{top:14px;right:16px}.lb .p{left:14px;top:50%}.lb .nx{right:14px;top:50%}
.lb span{color:#fff;margin-top:12px;font-size:12px}
@media(max-width:600px){.row,.step-head{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav">
  <a href="devadmin.html" class="on">開発管理</a>
  <a href="ldyadmin.html">在庫管理</a>
  <a href="opsadmin.html">管理委託</a>
</nav>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="editor"></div>
</div>
<div class="bar"><span id="msg"></span><button class="btn btn-g" onclick="saveAll()">保存する</button></div>
<div class="lb" id="lb" onclick="if(event.target===this)closeLB()">
  <button class="c" onclick="closeLB()">✕</button><button class="p" onclick="lbMove(-1)">‹</button><button class="nx" onclick="lbMove(1)">›</button>
  <img id="lb-img" alt=""/><span id="lb-c"></span>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,getDocs,doc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const app=initializeApp({apiKey:"AIzaSyDkmtJQhOITvYuB0615DIHc1fd8ju_D3F8",authDomain:"ldy-house.firebaseapp.com",projectId:"ldy-house",storageBucket:"ldy-house.firebasestorage.app",messagingSenderId:"1000570179268",appId:"1:1000570179268:web:47ebb6b077088f39f88391"});
const db=getFirestore(app),st=getStorage(app);

const S=(t,s)=>({text:t,status:s,photos:[]});
const DEFAULTS=[
 {id:'p1',num:'PROJECT 01',name:'アパート・マンション開発プロジェクト',type:'集合住宅 ｜ 東京都内',status:'done',photo:'',desc:'上棟を完了し、現在は内装・設備工事を進めています。',area:'東京都内',completion:'2026年予定',steps:[S('着工・基礎工事','done'),S('躯体工事','done'),S('上棟','done'),S('内装・設備工事','current'),S('完成・引渡し','future')]},
 {id:'p2',num:'PROJECT 02',name:'プレミアム戸建て開発プロジェクト',type:'豪華戸建て ｜ 東京都内',status:'progress',photo:'',desc:'随所にこだわりを詰め込んだ豪華な一邸。基礎工事が完了し、いよいよ上棟を迎えようとしています。',area:'東京都内',completion:'2026年予定',steps:[S('着工・地縄確認','done'),S('基礎工事','done'),S('上棟','current'),S('内装・設備工事','future'),S('完成・引渡し','future')]},
 {id:'p3',num:'PROJECT 03',name:'戸建て開発プロジェクト',type:'戸建て ｜ 東京都内',status:'early',photo:'',desc:'現在、既存建物の解体工事を進めています。更地になった後は新築工事へと移行します。',area:'東京都内',completion:'2026年予定',steps:[S('解体工事','current'),S('地盤調査・基礎工事','future'),S('躯体・上棟','future'),S('内装・設備工事','future'),S('完成・引渡し','future')]}
];
const STAT={done:'上棟済み',progress:'間もなく上棟',early:'解体中',construction:'工事中',plan:'計画中',complete:'完成'};
const SST={done:'完了',current:'現在',future:'未着手'};
let P=[],cur=0,activeStep=0,drag=null,lb={list:[],i:0};
const $=id=>document.getElementById(id);
const msg=t=>{$('msg').textContent=t};

const snap=await getDocs(collection(db,'dev_projects'));
const saved={};snap.forEach(d=>saved[d.id]=d.data());
P=DEFAULTS.map(d=>saved[d.id]?{...d,...saved[d.id]}:d);
P.forEach(p=>p.steps=p.steps||[]);
render();

function render(){
  $('tabs').innerHTML=P.map((p,i)=>`<div class="tab ${i===cur?'on':''}" onclick="selP(${i})">${p.num}</div>`).join('');
  const p=P[cur];
  $('editor').innerHTML=`<div class="box">
    <label>プロジェクト名</label><input type="text" value="${esc(p.name)}" oninput="P[cur].name=this.value">
    <div class="row"><div><label>ステータス</label><select onchange="P[cur].status=this.value">${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div><label>完成予定</label><input type="text" value="${esc(p.completion||'')}" oninput="P[cur].completion=this.value"></div></div>
    <label>説明</label><textarea oninput="P[cur].desc=this.value">${esc(p.desc||'')}</textarea></div>
    ${p.steps.map((s,si)=>stepHtml(s,si)).join('')}
    <button class="btn btn-s" onclick="addStep()">＋ 工程を追加</button>
    <p class="hint">写真は工程ごとに、ドラッグ＆ドロップ／クリップボードからの貼り付け（Ctrl+V）／枠クリックで追加できます（HEIC対応）。貼り付けは選択中（金枠）の工程に入ります。写真はドラッグで並べ替え、クリックで拡大できます。</p>`;
}
function stepHtml(s,si){
  return `<div class="step ${si===activeStep?'active':''}" data-si="${si}" onclick="activeStep=${si};markActive()"
   ondragover="stepOver(event,${si})" ondragleave="this.classList.remove('over')" ondrop="stepDrop(event,${si})">
   <div class="step-head"><input type="text" value="${esc(s.text)}" oninput="P[cur].steps[${si}].text=this.value">
   <select onchange="P[cur].steps[${si}].status=this.value">${Object.entries(SST).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select>
   <button class="btn btn-s" onclick="delStep(${si})">削除</button></div>
   <div class="photos">${(s.photos||[]).map((ph,pi)=>`<div class="ph" draggable="true" data-pi="${pi}"
     ondragstart="dStart(event,${si},${pi})" ondragend="this.classList.remove('drag')" ondragover="pOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="pDrop(event,${si},${pi})">
     <img src="${ph.url}" alt="" onclick="openLB(${si},${pi})"><span class="n">${pi+1}</span>
     <button class="x" onclick="delPh(event,${si},${pi})">✕</button>
     <input type="text" placeholder="日付 例 2026.10.3" value="${esc(ph.date||'')}" oninput="P[cur].steps[${si}].photos[${pi}].date=this.value" onclick="event.stopPropagation()"></div>`).join('')}
     <div class="ph up" style="cursor:pointer" onclick="pick(${si})">＋ 追加</div></div></div>`;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// ---- 画像処理 ----
async function toJpeg(file){
  let blob=file;
  if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name)){
    const r=await heic2any({blob:file,toType:'image/jpeg',quality:.9});blob=Array.isArray(r)?r[0]:r;
  }
  const bmp=await createImageBitmap(blob);
  const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*k;c.height=bmp.height*k;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}
async function addFiles(files,si){
  const imgs=[...files].filter(f=>/^image\//.test(f.type)||/\.(hei[cf]|jpe?g|png|webp|gif)$/i.test(f.name));
  if(!imgs.length)return;
  const p=P[cur],step=p.steps[si],d=new Date(),date=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  let n=0;
  for(const f of imgs){
    msg(`アップロード中 ${++n}/${imgs.length}…`);
    try{
      const b=await toJpeg(f);
      const r=ref(st,`dev_projects/${p.id}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`);
      await uploadBytes(r,b);
      step.photos.push({url:await getDownloadURL(r),date});
      render();
    }catch(e){console.error(e);msg('失敗: '+f.name+'（'+e.message+'）');return;}
  }
  msg('アップロード完了。「保存する」で確定します');
}
// ---- 操作 ----
Object.assign(window,{P_:P,esc,
 selP(i){cur=i;activeStep=0;render()},
 markActive(){document.querySelectorAll('.step').forEach(e=>e.classList.toggle('active',+e.dataset.si===activeStep))},
 addStep(){P[cur].steps.push(S('新しい工程','future'));activeStep=P[cur].steps.length-1;render()},
 delStep(si){if(confirm('この工程を削除しますか？')){P[cur].steps.splice(si,1);activeStep=0;render()}},
 delPh(e,si,pi){e.stopPropagation();P[cur].steps[si].photos.splice(pi,1);render()},
 pick(si){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='image/*,.heic,.heif';i.onchange=()=>addFiles(i.files,si);i.click()},
 stepOver(e,si){e.preventDefault();if(e.dataTransfer.types.includes('Files'))e.currentTarget.classList.add('over')},
 stepDrop(e,si){e.preventDefault();e.currentTarget.classList.remove('over');if(e.dataTransfer.files.length){activeStep=si;addFiles(e.dataTransfer.files,si)}},
 dStart(e,si,pi){drag={si,pi};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');e.currentTarget.classList.add('drag')},
 pOver(e,el){if(drag){e.preventDefault();e.stopPropagation();el.classList.add('drop')}},
 pDrop(e,si,pi){
   if(!drag||e.dataTransfer.files.length)return;
   e.preventDefault();e.stopPropagation();
   if(drag.si===si){const a=P[cur].steps[si].photos,[m]=a.splice(drag.pi,1);a.splice(pi,0,m);}
   drag=null;render();
 },
 openLB(si,pi){lb={list:P[cur].steps[si].photos,i:pi};showLB();$('lb').classList.add('open')},
 closeLB(){$('lb').classList.remove('open')},
 lbMove(d){lb.i=(lb.i+d+lb.list.length)%lb.list.length;showLB()},
 async saveAll(){
   msg('保存中…');
   try{const p=P[cur];await setDoc(doc(db,'dev_projects',p.id),JSON.parse(JSON.stringify(p)),{merge:true});msg('保存しました（'+p.num+'）')}
   catch(e){console.error(e);msg('保存失敗: '+e.message)}
 }
});
window.P=P;Object.defineProperty(window,'cur',{get:()=>cur,set:v=>cur=v});Object.defineProperty(window,'activeStep',{get:()=>activeStep,set:v=>activeStep=v});
function showLB(){$('lb-img').src=lb.list[lb.i].url;$('lb-c').textContent=`${lb.i+1} / ${lb.list.length}`}

document.addEventListener('paste',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!e.clipboardData.files.length)return;
  const fs=[...e.clipboardData.files];if(fs.length){e.preventDefault();addFiles(fs,activeStep)}
});
// ページ全体へのドロップでブラウザが画像を開くのを防止
['dragover','drop'].forEach(t=>window.addEventListener(t,e=>{if(e.dataTransfer?.types.includes('Files'))e.preventDefault()}));
document.addEventListener('keydown',e=>{
  if(!$('lb').classList.contains('open'))return;
  if(e.key==='ArrowLeft')lbMove(-1);if(e.key==='ArrowRight')lbMove(1);if(e.key==='Escape')closeLB();
});
</script>
</body>
</html>
